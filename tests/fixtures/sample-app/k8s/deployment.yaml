apiVersion: apps/v1
kind: Deployment
metadata:
  name: batchtrack-api
  namespace: batchtrack
  labels:
    app.kubernetes.io/name: batchtrack-api
    app.kubernetes.io/part-of: batchtrack
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: batchtrack-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batchtrack-api
        app.kubernetes.io/part-of: batchtrack
    spec:
      serviceAccountName: batchtrack-api
      containers:
        - name: api
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/batchtrack-api:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BATCHTRACK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: batchtrack-db
                  key: url
            - name: BATCHTRACK_LIMS_URL
              value: https://lims.bog-plant.internal/api/v2
            - name: BATCHTRACK_LIMS_TOKEN
              value: lims_pat_4f8a2c91d7e34b06a5c1f9e2d8b7a630
            - name: TZ
              value: America/Bogota
          securityContext:
            privileged: true
            runAsUser: 0
