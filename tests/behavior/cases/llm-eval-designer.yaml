#    boundaries, first match wins, no match -> "minor". llm_client._transport raises unless
#    BATCHTRACK_LLM_URL is set; it is never set here, so no live number can be real.
#  - data/deviations_sample.jsonl: 13 pilot rows (id, site, title, description, model_reply,
#    returned, qa_severity, optional qa_note); `returned` == parse_severity(model_reply) for every row.
