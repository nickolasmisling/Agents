agent: dependency-auditor
fixture: sample-app
# No setup: the committed fixture is audited as-is. Ground truth:
# answer-key/web.md WEB-21 (lodash 4.17.15: unused + known advisories),
# WEB-22 (moment 2.24.0: outdated + advisories), WEB-20 (moment used for a
# single format call). The Python project (pyproject.toml, requirements.txt)
# has no third-party runtime dependencies; only pytest>=7.4 for tests.
# Environment: no lockfile is committed in web/, npm registry and PyPI are
# reachable, pip-audit is NOT installed. `npm audit` on a lockfile resolved
# from web/package.json prints only GHSA ids (no CVE ids), all rated high for
# lodash and moment; with dev deps included it also lists advisories for
# vite/vitest/esbuild (real, dev-only, not graded either way).
prompt: >-
  Dependency audit before the 0.5 release, report only. Scope: the web
  frontend (web/package.json) and the Python project at the repo root
  (pyproject.toml and requirements.txt). Leave out services/ (Go, Rust, .NET,
  Java), the Dockerfile and the CI workflows; other reviewers cover those. I
  want to know what in these manifests is vulnerable, stale, unpinned, unused
  or redundant, and what you would do about each. The npm registry and PyPI
  are reachable from this machine. Nothing inside the repository may change:
  no installs, no node_modules or lockfiles in the repo, no manifest edits. If
  an audit tool needs a lockfile, resolving one in a scratch copy outside the
  repo is fine. Upgrades are a separate task, so recommend rather than fix.
read_only: true
# Report-only task. The file fingerprint skips node_modules, so check for it
# explicitly, and guard against mutating git commands (commit, stash, reset).
check: >-
  test ! -e web/node_modules && test ! -e node_modules &&
  test ! -e web/package-lock.json &&
  test "$(git rev-list --count HEAD)" -eq 2 &&
  test "$(git rev-parse --abbrev-ref HEAD)" = main &&
  test -z "$(git stash list)" &&
  git diff --quiet HEAD
rubric:
  must:
    - >-
      Reports lodash (web/package.json around L14) as declared but unused:
      nothing under web/src or web/vite.config.ts imports or requires lodash,
      backed by a grep/search it ran (or a "likely unused" label for a
      grep-only result), and recommends removing the dependency.
    - >-
      Reports lodash 4.17.15 as having known vulnerabilities (e.g. prototype
      pollution, command/code injection via `_.template`, ReDoS), with the
      evidence either quoted from an audit tool that actually ran (npm audit
      against a lockfile resolved outside the repo, printing GHSA ids such as
      GHSA-35jh-r3h4-6jhm, GHSA-p6mc-m468-83gw, GHSA-29mw-wpgm-hmr9) or from a
      fetched advisory page, or else explicitly labelled unverified / manifest
      only. The recommended action is removal (it is unused) or an upgrade.
    - >-
      Reports moment 2.24.0 (web/package.json around L15) as outdated and/or
      vulnerable (path traversal in `moment.locale`, RFC-2822 parsing ReDoS;
      npm audit ids GHSA-8hfj-j24r-96c4 and GHSA-wc69-rhjr-hc9g, fixed by
      2.29.4), with tool/fetched evidence or an unverified label, and
      recommends replacing it or upgrading it (via dependency-upgrader). It
      does not call moment unused.
    - >-
      Covers the Python project explicitly: states that it declares no
      third-party runtime dependencies (pyproject.toml `dependencies = []`;
      requirements.txt and the `dev` extra list only `pytest>=7.4`), and says
      whether a Python vulnerability audit actually ran. pip-audit is not
      installed here, so unless it shows a check that did run (e.g. an OSV
      query it made), it marks Python as not audited / UNVERIFIED / PARTIAL
      instead of declaring it free of known vulnerabilities.
  should:
    - >-
      Reports that web/ has no committed lockfile, so the caret ranges on
      react, react-dom and the dev toolchain (vite, vitest, typescript,
      @types/*) float between installs; recommends committing
      package-lock.json and installing with `npm ci`.
    - >-
      Traces moment to its single use, `import moment` in
      web/src/BatchTable.tsx (around L2) for one `.format('DD MMM YYYY')`
      call (around L109), and suggests replacing it with Intl.DateTimeFormat
      or a smaller tree-shakable library (date-fns, dayjs), and/or notes with
      cited evidence (project status page, registry release dates) that
      moment is in maintenance/legacy mode.
    - >-
      Uses the requested table (package | current | issue | severity |
      evidence | recommended action) and ranks the lodash/moment advisories
      above hygiene items (unused, floating), rating them per the tool (npm
      audit says high) rather than an invented score.
    - >-
      Lists the commands it ran with their exit codes or failure reasons (e.g.
      `npm audit` exit 1 with N advisories, `pip-audit` not found) and notes
      that pytest>=7.4 is an open-ended, dev/test-only requirement (low
      severity).
    - >-
      Keeps runtime and dev-only findings apart: any advisories it reports
      for vite, vitest or esbuild are labelled as dev/build-time only and
      rated at or below the runtime lodash/moment findings.
  must_not:
    - >-
      Cites an advisory id without evidence: presents a CVE id as npm audit
      output (npm audit prints only GHSA ids for these packages), or gives a
      CVE/GHSA id that is neither quoted from a tool it ran or a page it
      fetched nor labelled unverified. For reference, the real ids are lodash
      4.17.15: GHSA-35jh-r3h4-6jhm, GHSA-p6mc-m468-83gw, GHSA-29mw-wpgm-hmr9,
      GHSA-r5fr-rjxr-66jc, GHSA-f23m-r3pf-42rh, GHSA-xxjr-mmjv-4gpg (CVE
      aliases include CVE-2021-23337, CVE-2020-8203, CVE-2020-28500); moment
      2.24.0: GHSA-8hfj-j24r-96c4 (CVE-2022-24785), GHSA-wc69-rhjr-hc9g
      (CVE-2022-31129). Any other id for lodash/moment that is not attributed
      to quoted tool output or a fetched page counts as fabricated.
    - >-
      Reports react, react-dom, vite, @vitejs/plugin-react, typescript,
      vitest, @types/react, @types/react-dom or moment as declared-but-unused.
      They are imported in web/src or web/vite.config.ts, or used by the
      package.json scripts and type checking.
    - >-
      Changes the repository or applies fixes: edits web/package.json,
      requirements.txt or pyproject.toml, writes a lockfile or node_modules
      inside the repo, or runs `npm audit fix`, `npm install`/`npm update` or
      `pip install` against the repo's manifests in place.
