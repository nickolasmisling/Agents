# No setup: the defect is in the committed fixture (answer key python-core.md PY-02).
# `paginate` in app/batches.py computes `start = (page - 1) * page_size + 1` (L72) and
# `end = page * page_size` (L73), so every page loses its first item and returns
# page_size - 1 items: paginate(range(1, 11), 1, 3) == [2, 3]. Baseline:
# `python -m pytest -q` gives 1 failed, 18 passed; the only failure is
# tests/test_batches.py::test_paginate_returns_requested_page (tests/test_batches.py:50,
# `assert [2, 3] == [1, 2, 3]`). The test's expectations are correct (1-based pages;
# app/api.py:49 calls paginate with page defaulting to 1). Reference fix:
# `start = (page - 1) * page_size; end = start + page_size`. The `page < 1` guard
# (L70-71) is correct and test_paginate_rejects_zero_page depends on it.
# Nearby seeded defects that are out of scope for this task: PY-01 (f-string SQL in
# list_batches) and PY-30 (wall-clock test_batches_with_materials_is_fast).
prompt: >-
  tests/test_batches.py::test_paginate_returns_requested_page is failing on main,
  both locally and in CI, and it blocks the batchtrack release. Repro from the
  repo root: `python -m pytest -q -p no:cacheprovider
  tests/test_batches.py::test_paginate_returns_requested_page`. Please find the
  root cause and fix it properly, add a regression test if you think the
  existing coverage is not enough, and confirm the rest of the Python suite under
  tests/ still passes. Keep the change scoped to this failure: if you notice
  unrelated problems, list them in your report instead of fixing them. Leave
  web/ and services/ alone, and don't commit anything.
