agent: architecture-reviewer
fixture: sample-app
# No setup: the review targets the committed fixture as-is.
prompt: >-
  Architecture review, read-only. We are about to build more endpoints on the
  Python backend and want to know first whether its structure is sound. Review
  the package in app/ against docs/architecture.md: where responsibilities live
  (HTTP handling, business rules, data access and transactions, configuration,
  external integrations, caching), which way dependencies point between the
  modules, whether modules follow one consistent pattern, and whether the code
  actually matches what the architecture doc describes. Scope is app/ and its
  tests; web/, services/ and the deployment files are out of scope. Do not
  modify any files. Report an overall verdict, then the structural problems in
  priority order with file:line evidence, what each one makes hard (testing,
  change, correctness), and the smallest structural fix for each. Leave
  line-level bugs to code review unless one is a symptom of a structural
  problem.
read_only: true
rubric:
  must:
    - "Identifies the duplicated batch-number normalisation/validation as one rule with two owners: utils.clean_batch_no with its _BATCH_NO regex (app/utils.py L10, L18-23) repeats batches.normalize_batch_no with BATCH_NO_RE (app/batches.py L7, L10-15); api.py do_POST (L71) validates with the utils copy and then batches.create_batch (L22) normalises again with the batches copy, so the two can drift. Recommends keeping a single owner (e.g. batches.normalize_batch_no) and deleting or re-pointing the other."
    - "Reports at least one concrete divergence between docs/architecture.md and the code, citing the doc statement and the code evidence. Any of these counts: (a) the request-flow diagram shows app.api calling the LIMS REST API, but app/api.py never imports lims_client and nothing else in app/ does either; (b) the doc says the API process runs scheduled background jobs in-process, but nothing in app/ schedules anything (cache.warm_cache is never called); (c) the doc makes db/migrations/ (PostgreSQL, per 001_init.sql) the schema of the shared database, but app/ never applies it and instead creates its own SQLite schema from app/db.py SCHEMA via serve() -> init_db; (d) the doc says audit_log holds old and new values for every change to a GxP record, but signatures.update_signature and signatures.delete_signature (and batches.create_batch) write no audit entry; (e) the doc's status lifecycle (planned -> in_progress -> quarantined -> released/rejected) is enforced nowhere: batches.release_batch (app/batches.py L77-86) releases a batch from any status other than 'released'."
    - "Identifies inconsistent connection/transaction ownership and names at least one specific function. Either counts: (a) batches.set_actual_qty (app/batches.py L89-104) takes a db_path and opens and closes its own connection with db.connect, while its sibling functions receive a conn and api.py uses db.session (pattern drift); or (b) domain functions commit their own transactions (conn.commit() in batches.create_batch L24, release_batch L85, signatures.sign_batch L26, and also set_actual_qty, update_signature, delete_signature, users.create_user) although api.py already wraps its calls in db.session(), which owns commit/rollback, so a request cannot combine several of these calls into one atomic unit and the session's rollback cannot undo work they have already committed."
    - "Gives an explicit overall verdict that the structure needs work before more endpoints are added (e.g. VERDICT: NEEDS_WORK; not PASS or NO_FINDINGS), and for each of its top three findings gives file:line evidence, a stated consequence (what becomes hard to test, change or keep correct), and a concrete smallest fix that names the functions or modules to move, merge or inject, rather than a rewrite or a new framework."
  should:
    - "Flags configuration placement: settings and secrets are module globals in app/__init__.py (SECRET_KEY L9 and LIMS_API_TOKEN L14 as literals, DB_PATH L7 and LIMS_BASE_URL L11 read from the environment once at import) that db.py, api.py and lims_client.py bind with `from . import ...` at import time, and lims_client calls urllib.request directly, so the LIMS integration cannot be configured per environment or faked in tests without monkeypatching; suggests a settings object and/or an injected client."
    - "Flags that the HTTP boundary has no single serialisation/error-mapping layer: GET /batches/<id> returns the raw DB row with snake_case columns (app/api.py L56) while the list endpoint maps rows through _summary to camelCase (L10-18, L50), and/or domain and parse exceptions (LookupError from release_batch, ValueError from int() on path/query values) are not mapped to HTTP status codes in one place."
    - "Flags app/cache.py as a parallel data-access path: _load runs its own SELECT on batches (L18) instead of going through batches.py, the cache is module-global mutable state (_cache, _stats), and no write path (release_batch, set_actual_qty) calls cache.invalidate, so wiring it into the API would serve stale batch status for up to TTL_SECONDS (300 s)."
    - "Notes that audit logging is applied ad hoc per function (release_batch, set_actual_qty and sign_batch call db.write_audit; create_batch, update_signature and delete_signature do not) instead of at one enforced seam in the data-access layer."
    - "Notes that app/db.py SCHEMA (created at startup by api.serve() -> db.init_db) and db/migrations/*.sql are two schema sources of truth that already diverge: 002_add_site_and_cleanup.sql replaces batches.site with site_id and adds a sites table, while batches.py, api.py (_summary) and report.py still read and write site."
  must_not:
    - "States something factually wrong about the structure: that app/api.py itself contains or executes SQL statements (it has none; it delegates to batches/signatures and only opens db.session), that the app/ modules form an import cycle (the import graph is acyclic), or that db.session() fails to commit, roll back or close (app/db.py L71-82 does all three)."
    - "Calls any of the package's public functions or modules that nothing in app/ calls (e.g. lims_client.py / is_lot_approved / submit_sample, cache.warm_cache, batches.batches_with_materials, batches.set_actual_qty, signatures.update_signature, users.authenticate) dead code, or recommends deleting them as unused. Pointing out that they are not wired into api.py, contrary to the documented request flow, is fine."
    - "Makes line-level defects (the f-string SQL in list_batches, MD5 in users.hash_password, the paginate off-by-one, the missing urlopen timeout, the mutable default in report.collect_warnings) more than half of its numbered findings instead of structural ones. Mentioning them briefly, or handing them to code review, is fine."
