prompt: >-
  We're adding a diagrams page for the batchtrack Python backend (app/). Please create
  docs/diagrams.md with two Mermaid diagrams: (1) a sequence diagram of signing a batch
  record through the JSON API, from the incoming HTTP request through the modules and
  database statements involved to the response, including what happens when the
  signature cannot be recorded; (2) an ER diagram of the database schema the Python API
  creates at startup and queries: every table with its columns, and the relationships
  between tables. Draw what the code does today, not what it should do. The web UI
  (web/), services/ and the deployment files are out of scope. Create only that one file:
  don't change code, docs or config, and don't commit. In your report, give the source
  map (path:line for each element) and say how you validated the Mermaid syntax.
read_only: false
check: |
  f=docs/diagrams.md
  test -s "$f" || { echo "missing $f"; exit 1; }
  python3 - "$f" <<'PY' || exit 1
  import re, sys
  text = open(sys.argv[1], encoding="utf-8").read()
  fence = re.compile(r"^[ \t]*(`{3,}|~{3,})[ \t]*mermaid[^\n]*\n(.*?)^[ \t]*\1[ \t]*$", re.S | re.M)
  kinds = {}
  for m in fence.finditer(text):
      lines = [l.strip() for l in m.group(2).splitlines()]
      lines = [l for l in lines if l and not l.startswith("%%")]
      if lines and lines[0] == "---":  # optional front matter
          close = next((i for i in range(1, len(lines)) if lines[i] == "---"), len(lines))
          lines = lines[close + 1:]
      if lines:
          kinds.setdefault(lines[0].split()[0], []).append(lines[1:])
  problems = []
  seqs, ers = kinds.get("sequenceDiagram", []), kinds.get("erDiagram", [])
  if not seqs:
      problems.append("no ```mermaid block starting with sequenceDiagram")
  if not ers:
      problems.append("no ```mermaid block starting with erDiagram")
  # sequence: every alt/opt/loop/par/critical/break/rect/box closes with `end`
  for n, lines in enumerate(seqs, 1):
      depth = 0
      for l in lines:
          word = l.split()[0]
          if word in {"alt", "opt", "loop", "par", "critical", "break", "rect", "box"}:
              depth += 1
          elif l == "end":
              depth -= 1
              if depth < 0:
                  problems.append(f"sequence #{n}: `end` without an open block")
                  depth = 0
      if depth:
          problems.append(f"sequence #{n}: {depth} block(s) not closed with `end`")
  seq_text = "\n".join(l for b in seqs for l in b)
  for need in ("sign_batch", "201"):
      if need not in seq_text:
          problems.append(f"sequence diagram never mentions {need}")
  if "write_audit" not in seq_text and "audit_log" not in seq_text:
      problems.append("sequence diagram has no audit write (write_audit / audit_log)")
  # ER: at least one erDiagram has exactly the app/db.py SCHEMA tables and columns
  want = {
      "batches": {"id", "batch_no", "product", "site", "status", "planned_qty", "actual_qty", "created_at"},
      "materials": {"id", "batch_id", "lot_no", "name", "qty"},
      "signatures": {"id", "batch_id", "user_id", "meaning", "signed_at"},
      "users": {"id", "username", "password_hash", "role"},
      "audit_log": {"id", "table_name", "record_id", "action", "old_value", "new_value", "user_id", "at"},
  }
  need_pairs = [{"batches", "materials"}, {"batches", "signatures"}, {"signatures", "users"}]
  opener = re.compile(r'^"?([A-Za-z_][\w-]*)"?\s*(?:\[\s*"?([^"\]]+?)"?\s*\])?\s*\{\s*(.*?)\s*$')
  sym = re.compile(r'^"?([A-Za-z_][\w-]*)"?\s*((?:\|o|\|\||\}o|\}\|)(?:--|\.\.)(?:o\||\|\||o\{|\|\{))\s*"?([A-Za-z_][\w-]*)"?\s*:\s*\S')
  rel = re.compile(r'^"?([A-Za-z_][\w-]*)"?\s+(\S+(?:\s+\S+)*?)\s+"?([A-Za-z_][\w-]*)"?\s*:\s*\S')
  er_notes = []
  for n, lines in enumerate(ers, 1):
      ents, alias, rels, cur, bad = {}, {}, [], None, []
      for l in lines:
          if cur is not None:
              if l.startswith("}"):
                  cur = None
              else:
                  parts = l.split()
                  if len(parts) >= 2:
                      ents[cur].add(parts[1])
                  else:
                      bad.append(l)
              continue
          m = opener.match(l)
          if m:
              cur = m.group(1)
              ents[cur] = set()
              alias[cur] = (m.group(2) or cur).strip().lower()
              rest = m.group(3)
              if rest.endswith("}"):  # one-line entity block
                  for attr in filter(None, (a.strip() for a in rest[:-1].split("\n"))):
                      if len(attr.split()) >= 2:
                          ents[cur].add(attr.split()[1])
                  cur = None
              continue
          if l.split()[0] in {"direction", "title", "accTitle", "accDescr", "classDef", "class", "style"}:
              continue
          r = sym.match(l) or rel.match(l)
          if r and (r.re is sym or " to " in f" {r.group(2)} "):
              rels.append((r.group(1), r.group(3)))
          else:
              bad.append(l)
      if cur is not None:
          bad.append(f"entity {cur} not closed with }}")
      def table(eid):
          # table name from the id, its ["alias"], the alias's first word, or a type-prefixed
          # id such as tbl_batches / e_audit_log (the agent's grammar checklist prefixes ids)
          low, al = eid.lower(), alias.get(eid, "")
          for c in (low, al, (al.split() or [""])[0], re.sub(r"^[a-z]{1,5}_", "", low)):
              if c in want:
                  return c
          return al or low
      got = {table(e): cols for e, cols in ents.items()}
      diffs = []
      if set(got) != set(want):
          diffs.append(f"tables {sorted(got)} != {sorted(want)}")
      only_in_rels = {table(x) for r in rels for x in r} - set(want) - set(got)
      if only_in_rels:
          diffs.append(f"relationships to tables outside the schema: {sorted(only_in_rels)}")
      for t, cols in want.items():
          if t in got and got[t] != cols:
              diffs.append(f"{t}: missing {sorted(cols - got[t])}, extra {sorted(got[t] - cols)}")
      pairs = [{table(a), table(b)} for a, b in rels]
      diffs += [f"no relationship {sorted(p)}" for p in need_pairs if p not in pairs]
      diffs += [f"unparseable ER line: {b!r}" for b in bad]
      if not diffs:
          break
      er_notes.append(f"erDiagram #{n}: " + "; ".join(diffs))
  else:
      problems += er_notes
  if problems:
      print("\n".join(problems))
      sys.exit(1)
  print("diagrams present: sequence ok, ER matches app/db.py SCHEMA")
  PY
  test "$(git rev-list --count HEAD)" -eq 2 || { echo "commit count changed"; exit 1; }
  stray=$(git status --porcelain --untracked-files=all | cut -c4- | grep -Ev '^(docs/diagrams[.]md$|[.]claude/)|__pycache__/|[.]pytest_cache/')
  test -z "$stray" || { echo "changes besides docs/diagrams.md:"; echo "$stray"; exit 1; }
  echo "only docs/diagrams.md added"
rubric:
  must:
    - >-
      The sequence diagram follows the real call chain of the signing route, in this order:
      the POST /batches/<id>/signatures request handled by BatchHandler.do_POST (app/api.py
      L66, branch L80), `db.session(...)` opened (api.py L81 / db.py L72),
      `signatures.sign_batch` called with the batch id from the URL path and user_id,
      signed_at and meaning from the JSON body (api.py L82-84), the `SELECT id FROM batches`
      existence check (signatures.py L10), `INSERT INTO signatures` (L13-16), `write_audit`
      inserting an `audit_log` row (signatures.py L17-25, db.py L85-98), `conn.commit()`
      (signatures.py L26), and the 201 response with `{"signature_id": ...}` (api.py L85).
      Participants and messages use names that exist in these files (one SQLite participant,
      or collapsing `_route`/`_read_json` into one step, is fine). A source map, in the
      report or in docs/diagrams.md, gives path:line for these steps, and its line numbers
      match the ones cited here (within about 2 lines; a range that covers the line counts).
      Line numbers beyond the end of the file (app/signatures.py has 60 lines, app/db.py 98)
      or pointing at unrelated code do not count.
    - >-
      The failure path is drawn as it really behaves: when the batch does not exist,
      `sign_batch` raises `LookupError` (signatures.py L11-12) and app/api.py does not catch
      it or turn it into an HTTP response; the exception propagates out of do_POST (shown
      e.g. as an `alt`/`break` branch or a note).
    - >-
      The ER diagram has exactly the five tables of the app/db.py SCHEMA (L10-53) with all
      and only their columns: batches (id, batch_no, product, site, status, planned_qty,
      actual_qty, created_at), materials (id, batch_id, lot_no, name, qty), signatures (id,
      batch_id, user_id, meaning, signed_at), users (id, username, password_hash, role),
      audit_log (id, table_name, record_id, action, old_value, new_value, user_id, at).
      Upper-case, aliased or type-prefixed entity names (e.g. `tbl_batches["batches"]` or
      `tbl_batches`) and SQLite or generic types are fine.
    - >-
      The ER diagram draws the relationships batches-materials (via materials.batch_id),
      batches-signatures (signatures.batch_id) and users-signatures (signatures.user_id) as
      one-to-many with batches/users on the "one" side (e.g. `batches ||--o{ materials`, or
      the same written from the child side as `materials }o--|| batches`), each with a
      source-map entry (report or file) citing the column in app/db.py or a query/REFERENCES
      that uses it.
  should:
    - >-
      States that app/db.py declares no FOREIGN KEY / REFERENCES constraints (so SQLite
      enforces none), and backs the relationships with real evidence: the REFERENCES clauses
      in db/migrations/001_init.sql and/or queries in app/ (signatures.py L10, the JOIN users
      at L55-56, batches.py L59-60), not the column names alone. Cardinality follows NOT NULL:
      `||` on the parent side for batch_id/user_id, and users |o--o{ audit_log for the
      nullable audit_log.user_id if that edge is drawn.
    - >-
      Notes the drift between the two schema sources: db/migrations (PostgreSQL) declares
      REFERENCES, and 002_add_site_and_cleanup.sql adds a `sites` table and replaces
      batches.site with site_id, while app/ (db.py SCHEMA and its queries) still uses `site`;
      and it keeps the migrations schema out of the API's ER diagram (or draws it only as a
      separate, clearly labelled comparison).
    - >-
      Makes visible in the sequence that `user_id` and `signed_at` are taken from the
      request body (client-supplied) and `meaning` is optional, and/or that the only
      server-generated timestamp is audit_log.at via `utc_now_iso()` (app/utils.py, called at
      db.py L96); and/or shows sign_batch's own `conn.commit()` followed by db.session's
      commit and close (db.py L77, L82).
    - >-
      On the failure path, shows db.session rolling back and closing (db.py L78-82) and
      states that the client gets no HTTP response (connection closed); and/or covers the
      other uncaught failures on this route: `KeyError` when user_id/signed_at are missing
      from the body (api.py L83) or `ValueError` from `int(parts[1])`.
    - >-
      Reports honestly how syntax was validated (an mmdc exit code only if it actually ran;
      otherwise an explicit manual grammar check, noting mmdc is not installed), and the file
      gives a one-line caption per diagram and the commit the diagrams reflect.
  must_not:
    - >-
      The sequence diagram contains steps the code does not have: authentication or
      re-authentication (a password check, users.authenticate / verify_password / find_user),
      a user-existence or role check, validation of `meaning` against a list, server-side
      generation of signed_at, a participant this route never touches (app/cache.py, the
      LIMS client, app/users.py, the web UI, or an invented service/repository layer; the
      app/signatures.py module itself counts as touched however it is labelled), or an HTTP
      error response for a failure on this route (404, 400, 409, 422, 500 or an `{"error": ...}`
      body); or it describes db.session() as not rolling back or not closing on error (it
      does both; answer key FP-04).
    - >-
      The API's ER diagram presents something outside the app/db.py SCHEMA: a `sites` table,
      batches.site_id (or batches without `site`), a column that does not exist (e.g.
      batches.note, users.email, signatures.password or signature_hash), or audit_log.record_id
      drawn as a foreign key/relationship to one table (it is a polymorphic id paired with
      table_name). A separate, clearly labelled migrations diagram for comparison is not a
      violation.
    - >-
      A diagram in docs/diagrams.md has a Mermaid syntax error visible on inspection: an
      alt/opt/loop/par/critical/break/rect not closed with `end`, `end` used as a participant
      id, an unescaped `;` inside sequence message or note text, an ER relationship without a
      `: label`, or an ER attribute type containing a space (e.g. `NUMERIC(14, 3)`).
