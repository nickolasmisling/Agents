agent: log-analyzer
fixture: sample-app
# No setup: the log is in the committed fixture (answer key data-and-history.md section 2, LOG-xx).
# logs/app.log: 517 lines, 2026-09-14T12:00:00Z -> 13:59:59Z, `<ISO ts>Z <LEVEL> [<logger>] k=v`,
# Python tracebacks follow the owning ERROR line. Access logs are sampled (5 %), error lines are
# rate-limited (`suppressed N similar messages`); per-minute `batchtrack.metrics` lines carry true counts.
# Ground truth (all line numbers checked with grep on the fixture):
#  - Baseline L1-173: 0 ERROR lines, errors_5xx=0 on every metrics line, p95 121-184 ms, db_pool_in_use 1-3/10.
#  - Deploy 1.4.0 -> 1.4.1: SIGTERM L174 13:11:58, 1.4.1 starts L176 13:12:09 (commit 8e1d2c7), config L177,
#    NEW `scheduled job=cache_warmer every=120s workers=8 scope=all_batches` L179 (absent before),
#    `deploy finished release=1.4.1 previous=1.4.0 change=CHG-20931` L181 13:12:14.
#  - cw-0001 L183-184 takes 41.3 s; later runs 63.8 s, 97.2 s, 131.5 s, 158.9 s ...; active_runs=2 from
#    L224 (13:21:10), active_runs=3 from L334 (13:33:10); 7 runs finish, 15 fail.
#  - First ERROR/first failure L202 13:18:27.531 `database is locked` on POST /batches/1791/signatures
#    (traceback L203-209 ends in app/signatures.py:26 conn.commit(): the victim, not the cause).
#  - First `connection pool exhausted ... oldest_holder=ThreadPoolExecutor-5_7` L216 13:19:35 (all 18 such
#    lines name a ThreadPoolExecutor thread); first 503 PoolTimeout L219 13:20:14.
#  - cache_warmer cw-0005 failure L244 13:23:49 with traceback L245-273: scheduler.py _run_job ->
#    app/cache.py line 45 warm_cache -> line 32 get_batch -> line 18 _load -> database is locked.
#  - After: p95 ~3-5 s, errors_5xx 15 -> 24-34/min, pool 10/10; log ends still degraded.
#  - Red herrings (before L174 / after): utcnow DeprecationWarning audit_export.py:41 5/3; LIMS
#    `deprecated endpoint in use /api/v2/samples` 5/2; `login failed bad_password` 4/3; LIMS slow
#    response 3/2; slow /reports/site-yield 2/2; disk usage 81-82 % 3/1. audit_export runs all through
#    the good period.
#  - Root cause: the cache_warmer job new in 1.4.1 holds pool connections and SQLite locks; runs
#    overlap and slow down. Code contributors in app/cache.py: workers=8 against pool size 10, _load
#    opens a db.session per batch, no overlap guard. Fix: disable the job / roll back to 1.4.0.
# The prompt gives the symptoms users saw and the log path only; it does not mention the deploy,
# the job or the time of the first error.
prompt: >-
  We had a production incident on batchtrack on 2026-09-14 (UTC). QA users reported that signing
  batches and saving batch records kept failing, and that batch pages and the API became very slow
  or timed out; it had not recovered when the on-call engineer pulled logs/app.log from the app
  server, which is in this repo. The log is short enough to fit in a terminal, but I don't want to
  read it raw. Please digest it and tell me what happened: the time range it covers, when the
  failure started, the error clusters with counts, what changed shortly before, which warnings are
  just background noise, and the most likely root cause with the specific log lines (line numbers)
  that support it. If a stack trace points into our code you can read the source under app/ to
  confirm, but this is analysis only: don't modify, move or commit anything. I'll route the fix
  based on your report, so end with the next step you recommend and who should take it.
read_only: true
# Guard only (the task changes nothing): passes for a correct read-only run and fails if the agent
# commits, stashes, switches branch, edits the log or leaves stray files in the tree. Validated on a
# scratch copy: untouched tree -> exit 0; appended line to logs/app.log -> exit 1; stray untracked
# file -> exit 1; extra commit -> exit 1.
check: |
  test "$(git rev-list --count HEAD)" -eq 2 || { echo "commit count changed"; exit 1; }
  test "$(git rev-parse --abbrev-ref HEAD)" = main || { echo "branch changed"; exit 1; }
  test -z "$(git stash list)" || { echo "stash created"; exit 1; }
  cmp -s logs/app.log "$FIXTURES/sample-app/logs/app.log" || { echo "logs/app.log was modified"; exit 1; }
  stray=$(git status --porcelain --untracked-files=all | grep -Ev '(__pycache__/|\.pytest_cache/|^\?\? \.claude/)')
  test -z "$stray" || { echo "working tree changed:"; echo "$stray"; exit 1; }
  echo "tree unchanged"
rubric:
  must:
    - >-
      Puts the deploy of 1.4.0 -> 1.4.1 on the timeline at about 13:12 UTC, citing its lines (any of
      L174 SIGTERM for 1.4.0, L176 `starting batchtrack version=1.4.1`, L181 `deploy finished
      release=1.4.1 previous=1.4.0 change=CHG-20931`), and states that the period before it
      (12:00-13:11, L1-173) had no errors (errors_5xx=0 / no ERROR lines).
    - >-
      Gives the first failure as L202 at 13:18:27 (`sqlite3.OperationalError: database is locked` on
      `POST /batches/1791/signatures`, about 6 minutes after the deploy), and reports the connection
      pool exhaustion that follows (`connection pool exhausted` from L216 13:19:35 and/or `503 ...
      PoolTimeout` from L219 13:20:14) as a separate error cluster with a count.
    - >-
      Names the `cache_warmer` job that 1.4.1 introduced (scheduled at L179 with `every=120s
      workers=8 scope=all_batches`, not present before the deploy) as the most likely root cause,
      and cites the cache_warmer failure stack trace (L244-273, run cw-0005 at 13:23:49) that runs
      through app/cache.py `warm_cache` (line 45) into `get_batch`/`_load` and ends in `database is
      locked`.
    - >-
      Classifies the recurring deprecation warnings as red herrings with before/after evidence:
      the `DeprecationWarning: datetime.datetime.utcnow()` from audit_export.py:41 and/or the LIMS
      `deprecated endpoint in use endpoint=/api/v2/samples`, shown to occur both before and after
      the 13:12 deploy (counts per window, e.g. 5 before / 3 after, or an equivalent baseline
      comparison).
  should:
    - >-
      Quantifies the degradation from the per-minute `batchtrack.metrics` lines, not only from
      ERROR-line counts: errors_5xx 0 before 13:18 rising to roughly 24-34 per minute, p95 from
      ~120-185 ms to ~3-5 s, db_pool_in_use from 1-3/10 to 10/10; and notes that error lines are
      rate-limited (`suppressed N similar messages`) and/or access logs are sampled
      (access_log_sample=0.05), so raw ERROR counts understate the real 5xx volume.
    - >-
      Strengthens the causal chain with warmer-specific evidence: the pool's
      `oldest_holder=ThreadPoolExecutor-N_M` threads (the warmer's executor), overlapping runs
      (`active_runs=2` from L224 13:21:10, `active_runs=3` from L334 13:33:10), and/or run
      durations growing from 41.3 s (cw-0001) to several minutes with many runs failing.
    - >-
      Treats the first traceback (L203-209, app/signatures.py `sign_batch` -> `conn.commit()`) as
      where writes fail (a victim of the held lock), not as the cause, and notes that the other
      baseline noise (auth `login failed`, LIMS slow response, slow /reports/site-yield, disk
      usage 81-82 %, the audit_export job) also appears before the deploy.
    - >-
      Recommends a concrete mitigation (disable cache_warmer or roll back to 1.4.0) and routes the
      code follow-up to another agent (e.g. debugger, or performance-analyst), naming
      contributors in app/cache.py such as 8 workers against a pool of 10, a new db.session per
      batch in `_load`, no guard against overlapping runs, or scope=all_batches.
    - >-
      Uses the agent's output shape: a STATUS line with the root cause and confidence, then
      Sources, Time range (2026-09-14 12:00 -> 13:59/14:00 UTC), First failure, Clusters,
      Timeline, Red herrings, Root cause, Evidence chain with line numbers, Next step with an
      agent, and Key commands.
  must_not:
    - >-
      Attributes the incident primarily to a condition that was already present before the
      deploy: the utcnow DeprecationWarning, the LIMS deprecated endpoint or slow responses,
      disk usage at 81-82 %, failed logins, the slow /reports/site-yield requests, or the
      audit_export job.
    - >-
      Names the signatures code (app/signatures.py `sign_batch` / `conn.commit()`) or the POST
      /batches/*/signatures traffic as the root cause, rather than as where writes fail.
    - >-
      Reports a first failure, ERROR line or non-zero errors_5xx before 13:18 (for example,
      places the start of the incident in the 12:00-13:11 baseline or before the deploy).
