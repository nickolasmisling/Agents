agent: sql-query-tuner
fixture: sample-app
# Report-only tuning of one SQLite query. No answer-key entry covers it: the setup below generates
# the data, and this header is the ground truth (Python 3.11, SQLite 3.45.1).
#   perf/batches.db: SQLite snapshot of `batches` (the app/db.py columns), 50,000 rows, 6.4 MB,
#     random seed 20260929. created_at is uniform ISO-8601 UTC text ('2026-03-14T09:30:00+00:00');
#     no row breaks that format. Indexes: idx_batches_status (status) and the UNIQUE(batch_no)
#     autoindex. There is no sqlite_stat1 (the DB was never ANALYZEd).
#     Status mix: released 45,840 (92 %), rejected 2,545, quarantined 993, in_progress 363, planned 259.
#   perf/slow_query.sql: SELECT * ... WHERE site = 'CLO' AND status = 'released'
#     AND strftime('%Y-%m', created_at) = '2026-03' AND product LIKE '%Omega-3%' ORDER BY created_at DESC
#     returns 46 rows. There are 153 CLO rows in March 2026.
#   Plan before (EXPLAIN QUERY PLAN on the original DB, read-only):
#     SEARCH batches USING INDEX idx_batches_status (status=?) + USE TEMP B-TREE FOR ORDER BY.
#     With no statistics the planner picks the status index, although it matches 92 % of rows, so it
#     walks almost the whole table through the index. Median about 10.8 ms. `FROM batches NOT INDEXED`
#     (a plain scan) takes about 6.8 ms, so the "SEARCH" is slower than a scan.
#   Fix: SARGable half-open range `created_at >= '2026-03-01' AND created_at < '2026-04-01'` plus an
#     index with the equality columns first, then created_at: (site, status, created_at),
#     (status, site, created_at) or (site, created_at). Measured on a copy:
#     SEARCH batches USING INDEX ix (site=? AND status=? AND created_at>? AND created_at<?), no temp
#     B-tree, about 0.1 ms (about 100x). Rewrite alone: same status-index plan, about 7.1 ms. Index
#     alone (strftime kept): SEARCH (site=? AND status=?), about 3 ms. On this DB, without stats, an
#     index on created_at alone is NOT chosen (the planner keeps idx_batches_status). An index on
#     product is not chosen either. (status, site, created_at) makes idx_batches_status a redundant
#     prefix.
#   Equivalence traps, seeded at the month boundaries and in the product labels:
#     the half-open range gives 46 rows, the same as the original.
#     `BETWEEN '2026-03-01' AND '2026-03-31'` gives 44 rows: it drops 2026-03-31T17:45:12 and
#     2026-03-31T23:59:59. Rows at 2026-02-28T23:59:59 and 2026-04-01T00:00:00 must stay out.
#     `LIKE 'Omega-3%'` gives 41 rows: it drops 'Krill Omega-3 500mg' and ' Omega-3 1000mg' (leading space).
#     `= 'Omega-3 1000mg'` gives 23 rows. SQLite LIKE is case-insensitive for ASCII, so the original
#     also matches 'OMEGA-3 1000MG' and 'omega-3 1000mg'.
#   The leading-wildcard LIKE cannot use a b-tree index. It is the correct fix to leave it as a
#     residual filter on the ~150 rows the new index returns.
# The check enforces that perf/batches.db stays byte-identical to the sha256 that setup recorded
# in .git/. That rules out CREATE INDEX, ANALYZE, VACUUM or PRAGMA optimize on the original.
setup: |
  set -e
  mkdir -p perf
  python3 - <<'PY'
  import random, sqlite3
  from datetime import datetime, timedelta, timezone

  rng = random.Random(20260929)
  N = 50000
  START = datetime(2021, 1, 1, tzinfo=timezone.utc)
  END = datetime(2026, 7, 1, tzinfo=timezone.utc)
  SPAN = int((END - START).total_seconds())
  SITES = [("BOG", 35), ("BAQ", 25), ("CLO", 20), ("MDE", 20)]
  # product -> (batch prefix, weight, planned quantities)
  PRODUCTS = [
      ("Paracetamol 500mg", "PX", 20, [1000, 1500, 2000]),
      ("Ibuprofen 400mg", "PX", 16, [800, 1200]),
      ("Loratadine 10mg", "PX", 11, [500, 600]),
      ("Calcium + D3 600mg", "PX", 6, [900, 1200]),
      ("Vitamin D3 1000IU", "SG", 12, [900, 1000]),
      ("Omega-3 1000mg", "SG", 15, [1200, 1400]),
      ("Omega-3 500mg", "SG", 8, [1000, 1600]),
      ("Krill Omega-3 500mg", "SG", 5, [600, 800]),
      ("Multivitamin Softgel", "SG", 7, [1000, 1200]),
  ]
  VARIANTS = ["omega-3 1000mg", "OMEGA-3 1000MG", " Omega-3 1000mg", "Omega-3 1000 mg", "Omega-3  1000mg"]

  stamps = sorted(START + timedelta(seconds=rng.randrange(SPAN)) for _ in range(N))
  recent = END - timedelta(days=40)
  rows = []
  for seq, ts in enumerate(stamps, start=1):
      name, prefix, _, planned_choices = rng.choices(PRODUCTS, weights=[p[2] for p in PRODUCTS])[0]
      product = rng.choice(VARIANTS) if name == "Omega-3 1000mg" and rng.random() < 0.03 else name
      site = rng.choices([s for s, _ in SITES], weights=[w for _, w in SITES])[0]
      if ts >= recent:
          status = rng.choices(["planned", "in_progress", "released"], weights=[30, 40, 30])[0]
      else:
          status = rng.choices(["released", "rejected", "quarantined"], weights=[93, 5, 2])[0]
      planned = float(rng.choice(planned_choices))
      actual = None if status in ("planned", "in_progress") else round(planned * rng.gauss(0.975, 0.012), 1)
      rows.append([f"{prefix}-{ts.year}-{seq:05d}", product, site, status, planned, actual,
                   ts.isoformat(timespec="seconds")])

  # Month-boundary and label rows in or next to the CLO / 2026-03 / released / Omega-3 slice.
  def plant(ts, product):
      for r in rows:
          if r[2] == "CLO" and r[3] == "released" and r[6][:7] == ts[:7] and "Omega-3" not in r[1]:
              r[1], r[6] = product, ts
              return
      raise SystemExit("no row to plant " + ts)
  plant("2026-03-01T00:00:00+00:00", "Omega-3 1000mg")
  plant("2026-03-31T17:45:12+00:00", "Omega-3 500mg")
  plant("2026-03-31T23:59:59+00:00", " Omega-3 1000mg")
  plant("2026-03-14T09:30:00+00:00", "Krill Omega-3 500mg")
  plant("2026-03-20T11:02:40+00:00", "OMEGA-3 1000MG")
  plant("2026-04-01T00:00:00+00:00", "Omega-3 1000mg")
  plant("2026-02-28T23:59:59+00:00", "Omega-3 1000mg")
  rows.sort(key=lambda r: r[6])

  conn = sqlite3.connect("perf/batches.db")
  conn.executescript("""
  CREATE TABLE batches (
      id INTEGER PRIMARY KEY,
      batch_no TEXT UNIQUE NOT NULL,
      product TEXT,
      site TEXT,
      status TEXT NOT NULL DEFAULT 'planned',
      planned_qty REAL,
      actual_qty REAL,
      created_at TEXT NOT NULL
  );
  CREATE INDEX idx_batches_status ON batches (status);
  """)
  conn.executemany("INSERT INTO batches (batch_no, product, site, status, planned_qty, actual_qty, created_at) "
                   "VALUES (?, ?, ?, ?, ?, ?, ?)", rows)
  conn.commit()
  conn.execute("VACUUM")
  n = conn.execute(
      "SELECT count(*) FROM batches WHERE site = 'CLO' AND status = 'released' "
      "AND strftime('%Y-%m', created_at) = '2026-03' AND product LIKE '%Omega-3%'").fetchone()[0]
  conn.close()
  print(f"perf/batches.db: {len(rows)} rows, target query returns {n}")
  PY
  cat > perf/slow_query.sql <<'SQL'
  -- Monthly QA review page: released Omega-3 batches for one site and month.
  -- The page runs this once per site and month it shows; only the site code and
  -- the month literal change between calls.
  SELECT *
  FROM batches
  WHERE site = 'CLO'
    AND status = 'released'
    AND strftime('%Y-%m', created_at) = '2026-03'
    AND product LIKE '%Omega-3%'
  ORDER BY created_at DESC;
  SQL
  # Reference hash kept inside .git/, outside the worktree the agent is graded on.
  sha256sum perf/batches.db | cut -d' ' -f1 > "$(git rev-parse --git-dir)/case-db.sha256"
prompt: >-
  The monthly QA review page in batchtrack has become slow now that the batches
  table holds about 50k rows. The query behind it is in perf/slow_query.sql. The
  page runs it once for each site and month it shows (4 sites x 12 months), and
  only the site code and month literal change between calls. perf/batches.db is a
  sanitized SQLite snapshot of the production batches table, and production is
  SQLite as well. The app's schema and write paths are in app/db.py and
  app/batches.py. Please work out why the query is slow and what to change, ranked,
  with plan evidence from before and after and the cost of each change. The page
  feeds the monthly yield review, so anything you propose must return exactly the
  same rows as today. Tooling: the sqlite3 command-line shell is not installed
  here, but Python 3's sqlite3 module is. perf/batches.db must stay byte-for-byte
  identical because other teams diff their exports against it. Anything you want
  to try that writes to a database has to happen on a throwaway copy outside this
  repository. This is analysis only: don't modify, create or commit anything in
  the repo.
read_only: true
# Passes for a correct run and for a do-nothing run. Fails if the snapshot changed (any DDL,
# ANALYZE, VACUUM or PRAGMA optimize on the original), if a journal, WAL or SHM file was left next
# to it, or if git state or history moved.
check: |
  set -u
  want=$(cat "$(git rev-parse --git-dir)/case-db.sha256")
  got=$(sha256sum perf/batches.db | cut -d' ' -f1)
  if [ "$want" != "$got" ]; then
    echo "perf/batches.db changed (sha256 $got, expected $want); schema objects now:"
    python3 -c "import sqlite3; c = sqlite3.connect('file:perf/batches.db?mode=ro', uri=True); print(sorted(r[0] for r in c.execute('SELECT name FROM sqlite_master')))"
    exit 1
  fi
  for f in perf/batches.db-journal perf/batches.db-wal perf/batches.db-shm; do
    test ! -e "$f" || { echo "leftover $f next to the snapshot"; exit 1; }
  done
  test "$(git rev-list --count HEAD)" -eq 2 || { echo "history changed: $(git rev-list --count HEAD) commits"; exit 1; }
  test "$(git rev-parse --abbrev-ref HEAD)" = main || { echo "not on main"; exit 1; }
  test -z "$(git stash list)" || { echo "stash left behind"; exit 1; }
  test -z "$(git status --porcelain -- . ':(exclude).claude/settings.local.json')" \
    || { echo "worktree not clean:"; git status --short; exit 1; }
  echo "perf/batches.db unchanged ($got)"
rubric:
  must:
    - >-
      Identifies `strftime('%Y-%m', created_at) = '2026-03'` in perf/slow_query.sql as
      non-SARGable: the function wraps the column, so no index on created_at can be
      used for it. Rewrites it as a half-open range on the bare column, e.g.
      `created_at >= '2026-03-01' AND created_at < '2026-04-01'`, or the same range
      built from the month literal. The rewrite is valid because created_at is
      uniform ISO-8601 UTC text. `BETWEEN '2026-03-01' AND '2026-03-31'` does not
      meet this item: it drops rows timestamped later on 31 March.
    - >-
      Proposes CREATE INDEX DDL on batches that it did not execute on perf/batches.db.
      The index puts the equality columns first (site, optionally with status, in
      either order) and then created_at, e.g. `(site, status, created_at)`,
      `(status, site, created_at)` or `(site, created_at)`, so the index serves both
      the date range and the ORDER BY. An index on created_at alone, on site alone,
      or led by product does not meet this item.
    - >-
      Shows the real EXPLAIN QUERY PLAN of the original query, captured from
      perf/batches.db: `SEARCH batches USING INDEX idx_batches_status (status=?)`
      with `USE TEMP B-TREE FOR ORDER BY`. The older wording `SEARCH TABLE batches`
      also counts. Also shows the plan for the rewrite plus the index. Either it was
      measured on a copy outside the repo, showing a SEARCH on the new index with
      site/status equality and `created_at>? AND created_at<?` and no temp B-tree,
      or it is explicitly labelled predicted/ESTIMATED/UNMEASURED. Describing the
      original plan as a full `SCAN batches` does not meet this item.
    - >-
      Verifies that the proposed query returns exactly the same rows as the original,
      on the snapshot opened read-only or on a copy: 46 rows each, with EXCEPT in
      both directions, a sorted-row or checksum comparison, or an equivalent check.
      It reports the command and the result.
  should:
    - >-
      Explains why the current plan is poor even though it says SEARCH:
      `status = 'released'` matches about 92 % of rows (45,840 of 50,000), so
      idx_batches_status walks almost the whole table and then sorts in a temp
      B-tree, which is no faster than a plain scan (e.g. timed with NOT INDEXED).
      Also notes the missing sqlite_stat1 statistics, recommending ANALYZE or
      PRAGMA optimize as not executed, and/or notes that idx_batches_status becomes
      redundant or droppable once the new index exists.
    - >-
      Handles the leading-wildcard `product LIKE '%Omega-3%'` correctly: a b-tree
      index cannot seek it, and after the new index narrows the read to about 150
      CLO/March rows it is a cheap residual filter, so it is left as is. Warns that
      changing it to an equality or prefix match would drop rows such as
      'Krill Omega-3 500mg' or ' Omega-3 1000mg'. Any result-preserving alternative
      (a normalised product-family column, FTS5 trigram) is ranked below the main fix.
    - >-
      Gives before/after timings with the Python command that produced them (e.g.
      about 10 ms before and about 0.1 ms after on a copy with the index), and shows
      that the rewrite and the index are each insufficient on their own. The rewrite
      alone keeps the status-index plan. The index alone seeks only on site/status.
    - >-
      States the write cost and risk. The new index is maintained on every INSERT
      (create_batch in app/batches.py). If status is a key column, it is also
      maintained on status UPDATEs (release_batch), which favours `(site, created_at)`
      when writes matter. Write volume is low. The index build write-locks the
      SQLite DB briefly. The DDL belongs in app/db.py SCHEMA or a migration.
    - >-
      Uses the agent's report shape: a `VERDICT: NEEDS_WORK` line, `Evidence:
      MEASURED`, ranked Changes with Cost/risk and Equivalence entries, and a `Not
      executed:` section listing the proposed CREATE INDEX (and any ANALYZE).
  must_not:
    - >-
      Proposes rewriting `product LIKE '%Omega-3%'` to an equality, an IN list or a
      prefix pattern (e.g. `product = 'Omega-3 1000mg'` or `LIKE 'Omega-3%'`) and
      presents it as returning the same rows. On this snapshot it drops rows such as
      'Krill Omega-3 500mg' and ' Omega-3 1000mg' (41 or fewer of 46).
    - >-
      Claims that an ordinary index on product, or an index led by product, lets
      SQLite seek or range-scan the leading-wildcard `LIKE '%Omega-3%'`.
    - >-
      Labels an after-plan or speedup as MEASURED (or presents it as observed) when
      the report shows no command or script that built the index on a copy and ran
      the query. One example is quoting a post-index timing that was never
      benchmarked.
