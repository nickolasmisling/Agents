agent: changelog-writer
fixture: sample-app
# Scenario: answer key data-and-history.md section 3 (HIST-REG). regression_history.sh adds 10
# commits on main; commit 1 is tagged v1.3.0 (annotated). Setup then adds CHANGELOG.md (Keep a
# Changelog header and a [1.3.0] section citing the tag's short SHA, NO [Unreleased] heading) in an
# 11th commit; the runner adds an empty 'setup' commit on top. No commit mentions a PR number and
# there are no merge commits, so refs must be short SHAs (the style the file already uses).
# Ground truth for v1.3.0..HEAD (11 commits), as a changelog writer should see it:
#   2  "Add yield_by_batch helper for the yield export" (report.py)  -> internal; fold into 4
#   3  "Document batch and site yield definitions" (docs/yield.md)   -> docs: exclude or one docs entry
#   4  "Add CSV export of batch yields for QA review" (app/yield_export.py) -> Added
#   5  "Flag batches with yield outside 90-105 %" (yield_outliers)   -> Added
#   6  "Share quantity parsing between yield helpers" (Diego Ruiz)   -> subject reads like a refactor,
#       but the diff is user-visible: numeric-string quantities accepted, negative quantities give
#       None (n/a), zero planned gives None; and it silently swaps compute_batch_yield(actual,
#       planned) -> (planned, actual) while yield_by_batch still passes (actual, planned), which
#       inverts yields (the HIST-REG regression). Best handling: Changed entry and/or BREAKING /
#       concern for the swapped parameter order. Graded under 'should' only.
#   7  "Include site in the yield export"                             -> fold into 4 (export is new)
#   8  "Add tests for the yield CSV export"                           -> noise (test)
#   9  "Skip draft rows without a batch number in yield helpers"     -> Fixed, or fold into 4/5
#   10 "Explain yield rounding and the outlier window" (docs)         -> docs: exclude or fold with 3
#   11 "Start a changelog with the 1.3.0 release notes"               -> noise (the changelog itself)
#   +  runner's empty "setup" commit                                  -> noise
# Traps: the tagged commit 1 ("Add compute_batch_yield for single-batch yield") is already released
# and must not reappear (off-by-one range such as v1.3.0^..HEAD); pyproject.toml says 0.4.2 while
# the tag is v1.3.0 -- the agent must not bump either. Shas differ per run (commit dates derive from
# the baseline commit time), so the rubric grades by commit subject.
setup: |
  set -euo pipefail
  # The runner exports GIT_AUTHOR_*/GIT_COMMITTER_* (Fixture), which would override the per-commit
  # authors the scenario sets with `git -c user.name=...`; unset them so the history has real authors.
  unset GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL
  bash "$FIXTURES/scenarios/regression_history.sh"
  tag_sha=$(git rev-parse --short 'v1.3.0^{commit}')
  tag_day=$(git log -1 --format=%cs 'v1.3.0^{commit}')
  cat > CHANGELOG.md <<MD
  # Changelog

  All notable changes to batchtrack are documented in this file.

  The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
  and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

  ## [1.3.0] - ${tag_day}

  ### Added

  - Per-batch yield for the batch release form: the yield of a single batch in
    percent (actual over planned quantity, one decimal), shown as "n/a" while the
    actual quantity is missing (${tag_sha}).
  MD
  ts=$(( $(git log -1 --format=%ct) + 1800 ))
  git add CHANGELOG.md
  GIT_AUTHOR_DATE="$ts +0000" GIT_COMMITTER_DATE="$ts +0000" \
    git -c user.name="Camila Ortega" -c user.email="camila.ortega@batchtrack.example" \
        -c commit.gpgsign=false commit -q -m "Start a changelog with the 1.3.0 release notes"
  test -z "$(git status --porcelain)"
  gd=$(git rev-parse --git-dir)
  git rev-parse HEAD > "$gd/case-orig-tip"
  git rev-parse 'v1.3.0^{commit}' > "$gd/case-tag-commit"
prompt: >-
  We're getting the next batchtrack release ready. Please bring CHANGELOG.md up
  to date with everything that has landed on main since the last release, so
  the release manager can review the notes before we settle on a version
  number. The repo is the current directory, a clean checkout of main; there is
  no GitHub remote, so work from the local git history. Don't pick or bump the
  version, don't tag and don't commit; I'll handle the release itself.
read_only: false
# Passes only when CHANGELOG.md gained an [Unreleased] section (the file has none after setup, so a
# do-nothing run fails) directly above [1.3.0] with >= 2 bullets citing >= 2 distinct commits from
# v1.3.0..HEAD, no PR numbers, no SHA outside that range (e.g. the v1.3.0 commit), no version
# heading inside it, and the header plus the released sections byte-identical (modulo trailing
# whitespace). Git state: still on main with no new commits (runner's 'setup' commit aside), v1.3.0
# the only tag and unmoved, nothing staged or stashed, and CHANGELOG.md the only modified file.
check: |
  set -u
  gd=$(git rev-parse --git-dir)
  tip=$(cat "$gd/case-orig-tip"); tagc=$(cat "$gd/case-tag-commit")
  test "$(git symbolic-ref -q HEAD)" = refs/heads/main \
    || { echo "HEAD is not on branch main: $(git rev-parse --abbrev-ref HEAD)"; exit 1; }
  main=$(git rev-parse refs/heads/main)
  if [ "$main" != "$tip" ]; then
    test "$(git rev-parse "$main^")" = "$tip" && test "$(git log -1 --format=%s "$main")" = setup \
      || { echo "main moved: now $(git log -1 --oneline "$main"), expected $tip (+ runner setup commit)"; exit 1; }
  fi
  test "$(git tag -l)" = v1.3.0 || { echo "tags changed: $(git tag -l | tr '\n' ' ')"; exit 1; }
  test "$(git rev-parse 'v1.3.0^{commit}')" = "$tagc" || { echo "tag v1.3.0 moved"; exit 1; }
  test -z "$(git stash list)" || { echo "stash left: $(git stash list)"; exit 1; }
  changed=$(git status --porcelain --untracked-files=all | grep -v '\.claude/' || true)
  test "$changed" = " M CHANGELOG.md" \
    || { echo "expected only an unstaged edit to CHANGELOG.md, got:"; echo "${changed:-(no changes)}"; exit 1; }
  python3 - "$tagc" <<'PY'
  import re, subprocess, sys

  tagc = sys.argv[1]
  def git(*args):
      return subprocess.run(["git", *args], capture_output=True, text=True)
  def fail(msg):
      print(msg)
      sys.exit(1)
  def trim(lines):
      lines = [l.rstrip() for l in lines]
      while lines and not lines[-1]:
          lines.pop()
      return lines

  old = git("show", "HEAD:CHANGELOG.md").stdout.splitlines()
  new = open("CHANGELOG.md", encoding="utf-8").read().splitlines()
  o_rel = next(i for i, l in enumerate(old) if l.startswith("## [1.3.0]"))
  rel = [i for i, l in enumerate(new) if l.startswith("## [1.3.0]")]
  unr = [i for i, l in enumerate(new) if re.fullmatch(r"##\s+\[?unreleased\]?\s*", l, re.I)]
  if len(unr) != 1 or len(rel) != 1:
      fail(f"expected one '## [Unreleased]' and one '## [1.3.0]' heading, found {len(unr)} and {len(rel)}")
  u, r = unr[0], rel[0]
  if u > r:
      fail("[Unreleased] is not above [1.3.0]")
  if trim(new[r:]) != trim(old[o_rel:]):
      fail("released sections ([1.3.0] onward) were modified")
  if "\n".join(new[:u]).strip() != "\n".join(old[:o_rel]).strip():
      fail("changelog header (text above the first version heading) was modified")
  section = new[u + 1:r]
  if any(l.startswith("## ") for l in section):
      fail("a '## ' version heading was added between [Unreleased] and [1.3.0]")
  bullets = [l for l in section if re.match(r"\s*[-*] \S", l)]
  if len(bullets) < 2:
      fail(f"[Unreleased] has {len(bullets)} bullet entries, expected at least 2")
  text = "\n".join(section)
  pr = re.findall(r"(?<![\w&/#])#\d+\b", text)
  if pr:
      fail(f"[Unreleased] cites PR numbers {pr}, but no commit in the range references a PR")
  in_range = set(git("rev-list", f"{tagc}..HEAD").stdout.split())
  cited = set()
  for tok in sorted(set(re.findall(r"\b[0-9a-f]{7,40}\b", text))):
      res = git("rev-parse", "--verify", "-q", tok + "^{commit}")
      if res.returncode == 0:
          full = res.stdout.strip()
          if full not in in_range:
              fail(f"[Unreleased] cites {tok}, which is not a commit in v1.3.0..HEAD")
          cited.add(full)
      elif re.search(r"[a-f]", tok):
          fail(f"[Unreleased] cites {tok}, which looks like a SHA but is not a commit")
  if len(cited) < 2:
      fail(f"[Unreleased] cites {len(cited)} distinct commits from v1.3.0..HEAD, expected at least 2")
  print(f"ok: [Unreleased] with {len(bullets)} entries citing {len(cited)} in-range commits; "
        "released sections, tags and HEAD untouched")
  PY
rubric:
  must:
    - >-
      Adds a `## [Unreleased]` section to CHANGELOG.md directly above
      `## [1.3.0]` (the file had none) with the new entries grouped under Keep
      a Changelog `###` headings (Added / Changed / Fixed ...), references
      written as short SHAs in the style of the existing entries, and leaves
      the header and the released [1.3.0] section unchanged.
    - >-
      Has an Added entry, written as user-facing behavior, for the new CSV
      export of per-batch yields for the QA review (commit "Add CSV export of
      batch yields for QA review"), citing that commit's short SHA; the site
      column from "Include site in the yield export" is either folded into
      this entry or listed separately with that commit's SHA. An entry that
      only restates a function or module name (e.g. "Add write_yield_csv" or
      "Add app/yield_export.py") does not meet this.
    - >-
      Has an entry for flagging batches whose yield falls outside 90-105 %
      (commit "Flag batches with yield outside 90-105 %"), citing its short
      SHA and stating the window or that out-of-range batches are listed for
      QA follow-up.
    - >-
      Filters noise: no Unreleased entry for the test-only commit "Add tests
      for the yield CSV export", for the commit that created the changelog
      itself ("Start a changelog with the 1.3.0 release notes"), or for the
      empty "setup" commit.
  should:
    - >-
      Does not drop "Share quantity parsing between yield helpers" as a pure
      refactor on its subject alone: it records the user-visible effect seen
      in the diff (quantities given as numeric strings such as "985.0" are
      accepted; negative or invalid quantities give no yield / n/a) and/or
      flags that compute_batch_yield's parameters changed from (actual,
      planned) to (planned, actual) as **BREAKING** with a migration note or
      as a concern/uncertain item (callers such as yield_by_batch still pass
      (actual, planned)).
    - >-
      Covers "Skip draft rows without a batch number in yield helpers" as a
      user-visible change (under Fixed, or folded into the export/outlier
      entries): rows without a batch number are left out of the yield export
      and outlier list instead of failing, citing its SHA.
    - >-
      Merges commits that belong to one feature into a single entry citing
      all their SHAs (e.g. "Add yield_by_batch helper for the yield export"
      and "Include site in the yield export" together with the CSV export
      entry; the two docs/yield.md commits together or both excluded as docs)
      instead of one entry per commit or restated commit subjects.
    - >-
      States that the range is v1.3.0..HEAD (the last tag, found with git
      describe) and that no PR numbers exist in it (no merge commits, no
      "(#N)" subjects), which is why entries cite short SHAs.
    - >-
      Report follows the agent's output shape: a STATUS line, Range with the
      commit count, Style (Keep a Changelog, refs as SHAs), the entries added,
      an Excluded count by type (test / chore / docs), a Verification that
      every added line sits inside Unreleased and every cited SHA exists, and
      "Not done: version bump, tag, release heading".
  must_not:
    - >-
      Presents work already released in v1.3.0 as new: an Unreleased entry
      announcing the per-batch yield / compute_batch_yield itself as added
      (from the tagged commit "Add compute_batch_yield for single-batch
      yield"), or citing that tagged commit's SHA in Unreleased. An entry
      about how "Share quantity parsing between yield helpers" changed
      compute_batch_yield is fine.
    - >-
      Invents references or release data: a PR number such as "(#12)" (no
      commit in the range references a PR), a SHA that is not a commit in
      v1.3.0..HEAD, a change no commit in the range made (e.g. an API
      endpoint, UI button or Excel export for yields), or a version/date
      heading for the new entries (e.g. `## [1.4.0] - 2026-...`) instead of
      Unreleased.
    - >-
      Bumps the version in pyproject.toml or app/__init__.py, creates or moves
      a git tag, stages or commits, or edits any file other than CHANGELOG.md
      (including rewriting the released [1.3.0] section).
