# Target: app/report.py `site_summary` (answer key python-core.md PY-19): one ~60-line
# function, cyclomatic complexity 21, statements nested 5 levels deep (for -> else ->
# if pct < low -> else -> if rejected). Nothing under tests/ imports app.report (PY-23),
# so a careful simplifier has to pin behavior with characterization tests first.
# Behavior traps a "simplification" can break (all exercised by the probe below):
#  - low-yield flag is "released"/"rejected"/"open", but the high-yield flag is the raw
#    status ("in_progress", "planned", ...): the two append blocks are NOT identical,
#    so collapsing both to `row["status"]` changes output for include_open=True;
#  - open batches are counted in `batches` before being skipped, and are skipped
#    before yield_pct runs (an open batch with planned_qty 0 must not raise unless
#    include_open=True); a missing actual_qty is checked before yield_pct runs;
#  - flags and trend compare the ROUNDED pct / avg, low is checked before high;
#  - `rows` may be any iterable (a one-pass iterator must still work);
#  - in-passing bug fixes are behavior changes: yield_pct's unguarded division (PY-22)
#    and collect_warnings' mutable default `warnings=[]` (PY-20) must be reported,
#    not fixed. False-positive trap: build_report/format_report/collect_warnings are
#    public API although nothing in app/ calls them (FP-10); only `_percentile` is dead
#    (PY-21), and deleting it is allowed.
# Setup writes a characterization probe and its golden output for the pristine code
