  rec("format_report <- iter", report.format_report, summary)
  rec("site_summary(ROWS) again", report.site_summary, ROWS)

  rec("collect_warnings(ROWS) #1", report.collect_warnings, ROWS)
  rec("collect_warnings(ROWS[:8]) #2", report.collect_warnings, ROWS[:8])
  rec("collect_warnings(ROWS, [])", report.collect_warnings, ROWS, [])
  mine = ["pre-existing"]
  got = rec("collect_warnings(ROWS[:8], mine)", report.collect_warnings, ROWS[:8], mine)
  OUT.append(f"collect_warnings returns the passed list\t{got is mine}")
  OUT.append(f"rows unchanged\t{canon(ROWS) == canon(PRISTINE)}")

  conn = db.connect(":memory:")
