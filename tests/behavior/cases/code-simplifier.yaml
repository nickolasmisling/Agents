# Passes for a correct run, fails for a do-nothing run:
#  - no commits, stashes or branch switches; existing test files untouched; the only
#    changes are app/report.py and new files under tests/ (a stray .coverage is tolerated);
#  - the probe's output on the edited code is byte-identical to the golden output
#    captured on pristine code (signatures, constants, results, errors, no input
#    mutation, the collect_warnings default-list accumulation);
#  - no function in app/report.py nests statements more than 3 levels deep
#    (site_summary starts at 5; an `elif` counts as the same level as its `if`, a
#    literal `else: if` as one level deeper);
#  - the Python suite passes, including any tests the agent added, with the known
#    PY-02 failure deselected and the wall-clock test PY-30 deselected so the check
#    itself cannot flake.
check: |
  set -u
  test "$(git rev-list --count HEAD)" -eq 2 || { echo "commit count changed"; exit 1; }
  test "$(git rev-parse --abbrev-ref HEAD)" = main || { echo "branch changed"; exit 1; }
  test -z "$(git stash list)" || { echo "stash used"; exit 1; }
  git diff --quiet HEAD -- tests/__init__.py tests/conftest.py tests/test_batches.py tests/test_users.py \
    || { echo "existing tests changed"; exit 1; }
  stray=$(git status --porcelain --untracked-files=all \
    | grep -Ev '^(.. app/report\.py|(\?\?|A ) tests/.*|\?\? \.coverage.*|.. \.claude/.*)$')
  test -z "$stray" || { echo "unexpected changes: $stray"; exit 1; }
  python3 .git/char-baseline/probe.py > .git/char-baseline/after.txt 2> .git/char-baseline/after.err \
    || { echo "probe crashed:"; tail -n 15 .git/char-baseline/after.err; exit 1; }
  if ! cmp -s .git/char-baseline/golden.txt .git/char-baseline/after.txt; then
    echo "behavior of app/report.py changed:"
    diff .git/char-baseline/golden.txt .git/char-baseline/after.txt | cut -c1-400 | head -n 20
    exit 1
  fi
  python3 - <<'PY' || exit 1
  import ast
  import sys

  src = open("app/report.py", encoding="utf-8").read()
  lines = src.splitlines()
  tree = ast.parse(src)


  def is_elif(node):
      return lines[node.lineno - 1].lstrip().startswith("elif")


  def depth(stmts, d):
      """Deepest nesting level of any statement in stmts (a function body is level 0)."""
      best = d if stmts else 0
      for s in stmts:
          if isinstance(s, ast.If):
              best = max(best, depth(s.body, d + 1))
              if len(s.orelse) == 1 and isinstance(s.orelse[0], ast.If) and is_elif(s.orelse[0]):
                  best = max(best, depth(s.orelse, d))
              else:
                  best = max(best, depth(s.orelse, d + 1))
          elif isinstance(s, (ast.For, ast.AsyncFor, ast.While)):
              best = max(best, depth(s.body, d + 1), depth(s.orelse, d + 1))
          elif isinstance(s, (ast.With, ast.AsyncWith)):
              best = max(best, depth(s.body, d + 1))
          elif isinstance(s, ast.Try) or type(s).__name__ == "TryStar":
              blocks = [s.body, s.orelse, s.finalbody] + [h.body for h in s.handlers]
              best = max([best] + [depth(b, d + 1) for b in blocks])
          elif isinstance(s, ast.Match):
              best = max([best] + [depth(c.body, d + 2) for c in s.cases])
          elif isinstance(s, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
              best = max(best, depth(s.body, d + 1))
      return best


  top = {n.name for n in tree.body if isinstance(n, ast.FunctionDef)}
  if "site_summary" not in top:
      sys.exit("site_summary is no longer a module-level def in app/report.py")
  funcs = {n.name: depth(n.body, 0) for n in ast.walk(tree)
           if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
  print("max statement nesting per function:", funcs)
  deep = {name: d for name, d in funcs.items() if d > 3}
  if deep:
      sys.exit(f"still nested more than 3 levels deep: {deep}")
  PY
  out=$(python3 -m pytest -q -p no:cacheprovider tests/ \
    --deselect tests/test_batches.py::test_paginate_returns_requested_page \
    --deselect tests/test_batches.py::test_batches_with_materials_is_fast 2>&1)
  rc=$?
  printf '%s\n' "$out" | tail -n 3
  test "$rc" -eq 0 || { echo "test suite not green"; exit 1; }
