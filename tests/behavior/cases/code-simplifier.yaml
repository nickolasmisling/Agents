  import copy
  import inspect
  import os
  import sys

  sys.path.insert(0, os.getcwd())
  from app import db, report  # noqa: E402

  OUT = []


  def canon(o):
      if isinstance(o, dict):
          items = sorted(o.items(), key=lambda kv: repr(kv[0]))
          return "{" + ", ".join(f"{k!r}: {canon(v)}" for k, v in items) + "}"
      if isinstance(o, list):
          return "[" + ", ".join(canon(v) for v in o) + "]"
      if isinstance(o, tuple):
          return "(" + ", ".join(canon(v) for v in o) + ",)"
      return repr(o)


  def rec(label, fn, *args, **kwargs):
      try:
          value = fn(*args, **kwargs)
      except Exception as exc:  # record the exact error the caller would see
          OUT.append(f"{label}\tRAISES {type(exc).__name__}: {exc}")
          return None
      OUT.append(f"{label}\t{canon(value)}")
      return value


  PUBLIC = ["yield_pct", "collect_warnings", "site_summary", "format_report", "build_report"]
  for name in PUBLIC:
      fn = getattr(report, name, None)
      OUT.append(f"sig {name}\t{inspect.signature(fn) if callable(fn) else 'MISSING'}")
  OUT.append(f"const\t{getattr(report, 'LOW_YIELD_PCT', None)!r} {getattr(report, 'HIGH_YIELD_PCT', None)!r}")


  def r(no, site, status, planned, actual, product="Para 500", drop=()):
      row = {"batch_no": no, "product": product, "site": site, "status": status,
             "planned_qty": planned, "actual_qty": actual}
      for key in drop:  # rows from other callers may lack optional keys entirely
