# fingerprint and diff). The probe calls every public function of app.report on fixed
# inputs (positional and keyword calls, iterator input, custom/inverted thresholds,
# error paths) and prints signatures, results (dict keys sorted, int/float and
# list/tuple kept distinct) and exception type+message, one line per call.
# Baseline suite: 1 failed (test_paginate_returns_requested_page, PY-02), 18 passed.
