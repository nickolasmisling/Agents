      r("B-14", "CLO", "rejected", 1000.0, -5.0),
      r("B-15", "MED", "released", 100.0, 94.99, product="Vit C"),
      r("B-16", "MED", "released", 100.0, 95.0, product="Vit C"),
      r("B-17", "MED", "released", 100.0, 95.0, product="Vit C"),
      r("B-18", "MED", "planned", 100.0, None, product="Vit C", drop=("actual_qty",)),
      r("B-19", "MED", "released", 7.0, None, product="Vit C", drop=("actual_qty",)),
      r("B-20", "BOG", "released", 3.0, 1.0),
      r("B-21", "BAQ", "released", 0, None, product="Omega 3"),
      r("B-22", "BAQ", "released", 1200, 1224, product="Omega 3"),
      r("B-23", "BAQ", "on_hold", 800.0, 780.0, product="Ibu 400"),
      r("B-24", "BAQ", "rejected", 800.0, 760.0, product="Ibu 400", drop=("site",)),
  ]
  PRISTINE = copy.deepcopy(ROWS)
  OPEN_ZERO = [r("Z-01", "BOG", "released", 1000.0, 990.0), r("Z-02", "BOG", "in_progress", 0, 5.0)]
  RELEASED_ZERO = [r("Z-03", "BOG", "released", 0, 10.0)]
  NONE_PLANNED = [r("Z-04", "BOG", "rejected", None, 10.0)]

  for a, b in [(1000, 985), (3, 1), (800, 840), (1000.0, 949.996), (7, 0), (1000, -5),
               (0, 5), (0.0, 5.0), (None, 5)]:
      rec(f"yield_pct({a!r}, {b!r})", report.yield_pct, a, b)

  calls = [
      ("site_summary(ROWS)", (ROWS,), {}),
      ("site_summary(ROWS, include_open=True)", (ROWS,), {"include_open": True}),
      ("site_summary(ROWS, 90.0, 105.0, True)", (ROWS, 90.0, 105.0, True), {}),
      ("site_summary(ROWS, low=97, high=100)", (ROWS,), {"low": 97, "high": 100}),
      ("site_summary(ROWS, low=110.0, high=90.0, include_open=True)", (ROWS,),
       {"low": 110.0, "high": 90.0, "include_open": True}),
      ("site_summary([])", ([],), {}),
      ("site_summary(OPEN_ZERO)", (OPEN_ZERO,), {}),
      ("site_summary(OPEN_ZERO, include_open=True)", (OPEN_ZERO,), {"include_open": True}),
      ("site_summary(RELEASED_ZERO)", (RELEASED_ZERO,), {}),
      ("site_summary(NONE_PLANNED)", (NONE_PLANNED,), {}),
  ]
  for label, args, kwargs in calls:
      summary = rec(label, report.site_summary, *args, **kwargs)
      if summary is not None:
