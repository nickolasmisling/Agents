  )
  conn.commit()
  rec("build_report(conn)", report.build_report, conn)
  rec("build_report(conn, since=2026-03-12)", report.build_report, conn, since="2026-03-12T00:00:00+00:00")
  rec("build_report(conn, '2026-03-20')", report.build_report, conn, "2026-03-20T00:00:00+00:00")
  conn.execute("INSERT INTO batches (batch_no, product, site, status, planned_qty, actual_qty, created_at) "
               "VALUES ('Z-09', 'Para 500', 'BOG', 'released', 0, 12.0, '2026-04-01T08:00:00+00:00')")
  rec("build_report(conn) with planned_qty 0", report.build_report, conn)
  rec("collect_warnings(ROWS[:3]) after reports", report.collect_warnings, ROWS[:3])
  conn.close()

  print("\n".join(OUT))
  PY
  python3 .git/char-baseline/probe.py > .git/char-baseline/golden.txt
  test "$(grep -c . .git/char-baseline/golden.txt)" -ge 40
