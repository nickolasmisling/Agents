  from app import lims_client


  @pytest.mark.asyncio
  async def test_wait_for_results_returns_first_non_empty(monkeypatch):
      responses = iter([[], [], [{"test": "assay", "status": "pass"}]])
      monkeypatch.setattr(lims_client, "get_sample_results", lambda lot_no: next(responses))
      results = await lims_client.wait_for_results("API-PCM-2601", timeout=1.0, interval=0.01)
      assert results == [{"test": "assay", "status": "pass"}]


