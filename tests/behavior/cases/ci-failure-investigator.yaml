prompt: >-
  CI went red on my PR #87 (branch feat/lims-async-polling, "feat(lims): async
  polling for LIMS sample results"). There is no gh access from this
  environment, so I saved the full output of `gh run view 4521 --log` to
  ci-logs/run-4521.log in the repo. The previous push to this PR (run 4507) was
  green. Work out why run 4521 failed: the failing job and step, the actual
  first error with its line in that log, what kind of failure it is, what
  should change, and which agent should pick up the fix. This is diagnosis
  only: don't modify anything in the repo or its git state, and don't re-run
  anything.
read_only: true
# Report-only task: guard against mutating git commands (commit, stash, checkout,
# reset) that the file fingerprint cannot see, and make sure the conflicting pins
# are still what the run saw.
check: >-
  test "$(git rev-parse --abbrev-ref HEAD)" = feat/lims-async-polling &&
  test "$(git rev-list --count HEAD)" -eq 5 &&
  test "$(git rev-list --count main)" -eq 2 &&
  test -z "$(git stash list)" &&
  git diff --quiet HEAD &&
  grep -qx 'pytest==7.4.4' requirements.txt &&
  grep -qx 'pytest-asyncio==0.24.0' requirements.txt &&
  test -s ci-logs/run-4521.log
rubric:
  must:
    - >-
      Identifies the failing step as job `python` > `Install dependencies` (the
      `pip install -r requirements.txt` command) and gives pip's dependency
      conflict as the first real error, quoting `ERROR: Cannot install -r
      requirements.txt (line 4) and pytest==7.4.4 because these package versions
      have conflicting dependencies.` (ci-logs/run-4521.log line 296) and/or the
      lines under it (`pytest-asyncio 0.24.0 depends on pytest<9 and >=8.2`,
      L298-300, or `ERROR: ResolutionImpossible`, L309), with a log line number
      in the L296-L309 range or the line quoted verbatim. Naming only the
      `##[error]Process completed with exit code 1.` marker (L310) does not meet
      this.
    - >-
      Explains the cause concretely: requirements.txt pins `pytest==7.4.4` (line
      3) while `pytest-asyncio==0.24.0` (line 4) needs pytest >=8.2,<9, so the
      requirement set cannot be resolved.
    - >-
      Classifies the failure as a dependency change made in the PR (a
      code/dependency restore failure), not as a registry/network outage, a
      flaky test, runner/toolchain drift, a secrets/permissions problem or a
      YAML/config error, and hands the fix off to build-fixer.
    - >-
      Recommends a concrete compatible combination for requirements.txt: either
      relax the pytest pin to a version pytest-asyncio 0.24.0 accepts (e.g.
      `pytest>=8.2,<9` or a specific 8.x), or keep `pytest==7.4.4` and pin
      pytest-asyncio to a release that still supports pytest 7 (e.g.
      `pytest-asyncio<0.24` / `==0.23.8`).
  should:
    - >-
      Ties the conflict to the head commit "build: pin pytest to 7.4.4 to match
      the validated toolchain" (pytest>=7.4 -> pytest==7.4.4 in requirements.txt
      and pyproject.toml) as the only change since the previous push's commit
      "feat(lims): add async polling helper for sample results" (run 4507), using
      git log/diff or show, and notes that .github/workflows/ci.yml did not change.
    - >-
