  async def wait_for_results(lot_no, timeout=300.0, interval=10.0):
      """Poll LIMS until a lot has QC results; raise TimeoutError after ``timeout`` seconds."""
      loop = asyncio.get_running_loop()
      deadline = loop.time() + timeout
      while True:
          results = await asyncio.to_thread(get_sample_results, lot_no)
          if results:
              return results
          if loop.time() + interval > deadline:
              raise TimeoutError(f"no LIMS results for lot {lot_no} after {timeout:.0f}s")
          await asyncio.sleep(interval)
  EOF
  cat > tests/test_lims_async.py <<'EOF'
