# Scenario: PR #87 (branch feat/lims-async-polling) is red in GitHub Actions run 4521.
# Setup builds this history on top of the fixture baseline (all commits at the
# baseline timestamp, as in change-verifier.yaml):
#   main:  "fix(batches): paginate dropped the first row of every page" (PY-02 fixed,
#          so main's pytest suite is green and "the previous push was green" holds)
#   feat/lims-async-polling:
#     A "feat(lims): add async polling helper for sample results"
#       - app/lims_client.py: async wait_for_results()
#       - tests/test_lims_async.py: two @pytest.mark.asyncio tests
#       - requirements.txt line 4 + pyproject dev extra: pytest-asyncio==0.24.0
#       (this is run 4507, the previous, green push)
#     B "build: pin pytest to 7.4.4 to match the validated toolchain"   <- run 4521 SHA
#       - requirements.txt line 3 and pyproject dev extra: pytest>=7.4 -> pytest==7.4.4
#   then the runner's empty 'setup' commit.
# ci-logs/run-4521.log is `gh run view 4521 --log` output (job<TAB>step<TAB>ts line)
# for jobs pr-title (green), web (green) and python (red); it is git-ignored via
# .git/info/exclude so the tree at HEAD equals the run's SHA. SHAs and timestamps in
# the log are filled in from the scratch repo; the line numbers are fixed:
#   L1-L28     pr-title: the step's script text contains `echo "::error::PR title ..."`
#              (never executed; title passes). Early noise.
#   L29-L168   web: npm deprecation warnings + "7 vulnerabilities (... 2 critical)". Noise.
#   L169-L343  python job. Token permissions in Set up job: Contents/Metadata/Packages read.
#   L276       pip `WARNING: Retrying ... ReadTimeoutError ... pypi.org` during the pip
#              self-upgrade, which then succeeds (L277-L286). Red herring (not an outage).
#   L296       FIRST REAL ERROR: `ERROR: Cannot install -r requirements.txt (line 4) and
#              pytest==7.4.4 because these package versions have conflicting dependencies.`
#   L298-L300  "The conflict is caused by: The user requested pytest==7.4.4 /
#              pytest-asyncio 0.24.0 depends on pytest<9 and >=8.2"
#   L309       `ERROR: ResolutionImpossible: ...`
#   L310       `##[error]Process completed with exit code 1.` (end marker)
#   L311-L341  cascade: "Run tests" never ran (skipped); "Publish test report" ran only
#              because of `if: always()`: `##[warning]No file matches path
#              reports/junit.xml` (L331), "No test results found!", then a non-fatal
#              `##[error]... Resource not accessible by integration` (L335, token has no
#              Checks permission; latent INF-13, not why the run is red).
# The pip text is real pip 26.2.1 output for this requirements.txt (checked with
# `pip install --dry-run`). pytest-asyncio 0.24.0 requires pytest>=8.2,<9; 0.23.8
# requires pytest>=7.0.0,<9. Verified in scratch venvs: at commit A with pytest 8.4.x +
# pytest-asyncio 0.24.0 the suite passes (21 passed); with pytest==7.4.4 +
# pytest-asyncio==0.23.8 it also passes, so both fixes are valid.
# Expected: classification = code/dependency change in the PR (restore failure),
# hand-off build-fixer. Not: registry outage, flaky, drift, permissions, YAML.
setup: |
  set -euo pipefail
  ts=$(git log -1 --format=%ct)
  commit_as() {  # commit_as "<name>" "<email>" "<subject>" "<body>"
    GIT_AUTHOR_NAME="$1" GIT_AUTHOR_EMAIL="$2" GIT_COMMITTER_NAME="$1" GIT_COMMITTER_EMAIL="$2" \
    GIT_AUTHOR_DATE="$ts +0000" GIT_COMMITTER_DATE="$ts +0000" \
      git -c commit.gpgsign=false commit -q -m "$3" -m "$4"
  }
  edit() {  # edit <file> <old> <new>  (old must occur exactly once)
    python3 - "$1" "$2" "$3" <<'PY'
  import pathlib
  import sys

  path, old, new = sys.argv[1:4]
  p = pathlib.Path(path)
  text = p.read_text(encoding="utf-8")
  if text.count(old) != 1:
      sys.exit(f"setup: expected exactly one match in {path} for {old[:50]!r}")
  p.write_text(text.replace(old, new, 1), encoding="utf-8")
  PY
  }

  # main: fix PY-02 so the suite (and therefore the previous push) is green.
  edit app/batches.py $'    start = (page - 1) * page_size + 1\n    end = page * page_size\n' \
                      $'    start = (page - 1) * page_size\n    end = start + page_size\n'
