  using System;
  using System.Configuration;
  using System.Diagnostics;
  using System.Globalization;
  using System.ServiceProcess;
  using System.Threading;

  namespace BatchTrack.LabelPrinter
  {
      public class LabelPrinterService : ServiceBase
      {
          public const string Name = "BatchTrackLabelPrinter";

          private readonly object _passLock = new object();
          private System.Timers.Timer _timer;
          private SpoolProcessor _processor;

          public LabelPrinterService()
          {
              ServiceName = Name;
              CanStop = true;
              CanShutdown = true;
              AutoLog = true;
          }

          protected override void OnStart(string[] args)
          {
              var settings = ConfigurationManager.AppSettings;
              var spoolDirectory = settings["SpoolDirectory"];
              var gateway = new GatewayClient(new Uri(settings["GatewayUrl"]));
              var printLog = new PrintLog(ConfigurationManager.ConnectionStrings["LabelsDb"].ConnectionString);
              var pollSeconds = int.Parse(settings["PollIntervalSeconds"], CultureInfo.InvariantCulture);

              _processor = new SpoolProcessor(spoolDirectory, settings["DefaultPrinterId"], gateway, printLog,
                  settings["StateFile"]);
              _processor.LoadState();

              _timer = new System.Timers.Timer(pollSeconds * 1000) { AutoReset = true };
              _timer.Elapsed += (sender, e) => RunPass();
              _timer.Start();
              EventLog.WriteEntry("Watching " + spoolDirectory + " every " + pollSeconds + " s, "
                  + _processor.HeldCount + " held job(s)", EventLogEntryType.Information);
          }

          protected override void OnStop()
          {
              _timer?.Stop();
              lock (_passLock)
              {
                  _processor?.SaveState();
              }
          }

          protected override void OnShutdown()
          {
              OnStop();
          }

          private void RunPass()
          {
              if (!Monitor.TryEnter(_passLock))
              {
                  return; // the previous pass is still running
              }

              try
              {
                  _processor.ProcessSpool();
              }
              catch (Exception ex)
              {
                  EventLog.WriteEntry("Spool pass failed: " + ex, EventLogEntryType.Error);
              }
              finally
              {
                  Monitor.Exit(_passLock);
              }
          }

          internal void RunInteractive(string[] args)
          {
              OnStart(args);
              Console.WriteLine("Label printer running in console mode. Press Enter to stop.");
              Console.ReadLine();
              OnStop();
          }
      }
  }
  EOF
