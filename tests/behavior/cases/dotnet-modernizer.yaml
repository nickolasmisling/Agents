  using System;
  using System.IO;
  using System.Linq;
  using System.Net;

  namespace BatchTrack.LabelPrinter
  {
      /// <summary>
      /// One pass over the spool directory. Every ZPL file that services/labels wrote is sent to the
      /// print gateway, recorded in label_print_log and deleted. When the gateway answers 503 the
      /// printer is offline: the job is held in the queue state and retried on later passes. The
      /// state is written to the state file after every pass so held jobs survive a restart.
      /// </summary>
      public class SpoolProcessor
      {
          private readonly string _spoolDirectory;
          private readonly string _printerId;
          private readonly GatewayClient _gateway;
          private readonly PrintLog _printLog;
          private readonly string _stateFile;
          private PrintQueueState _state = new PrintQueueState();

          public SpoolProcessor(string spoolDirectory, string printerId, GatewayClient gateway,
              PrintLog printLog, string stateFile)
          {
              _spoolDirectory = spoolDirectory;
              _printerId = printerId;
              _gateway = gateway;
              _printLog = printLog;
              _stateFile = stateFile;
          }

          public int HeldCount
          {
              get { return _state.Held.Count; }
          }

          public void LoadState()
          {
              _state = PrintQueueState.Load(_stateFile);
          }

          public void SaveState()
          {
              _state.Save(_stateFile);
          }

          public void ProcessSpool()
          {
              RetryHeld();

              var files = new DirectoryInfo(_spoolDirectory).GetFiles("*.zpl")
                  .OrderBy(f => f.CreationTimeUtc)
                  .ToList();
              foreach (var file in files)
              {
                  var zpl = File.ReadAllText(file.FullName);
                  try
                  {
                      _gateway.Send(_printerId, zpl);
                      _printLog.Record(file.Name, _printerId, "printed");
                  }
                  catch (WebException ex) when (IsPrinterOffline(ex))
                  {
                      _state.Held.Add(new HeldJob
                      {
                          FileName = file.Name,
                          PrinterId = _printerId,
                          Zpl = zpl,
                          QueuedAtUtc = DateTime.UtcNow
                      });
                      _printLog.Record(file.Name, _printerId, "held");
                  }
                  file.Delete();
              }

              _state.LastPassUtc = DateTime.UtcNow;
              SaveState();
          }

          private void RetryHeld()
          {
              if (_state.Held.Count == 0 || !_gateway.IsOnline(_printerId))
              {
                  return;
              }

              foreach (var job in _state.Held.ToList())
              {
                  try
                  {
                      _gateway.Send(job.PrinterId, job.Zpl);
                      _printLog.Record(job.FileName, job.PrinterId, "printed");
                      _state.Held.Remove(job);
                  }
                  catch (WebException ex) when (IsPrinterOffline(ex))
                  {
                      job.Attempts++;
                      break;
                  }
              }
          }

          private static bool IsPrinterOffline(WebException ex)
          {
              var response = ex.Response as HttpWebResponse;
              return response != null && response.StatusCode == HttpStatusCode.ServiceUnavailable;
          }
      }
  }
  EOF
  cat > legacy/LabelPrinterService/PrintQueueState.cs <<'EOF'
  using System;
  using System.Collections.Generic;
  using System.IO;
  using System.Runtime.Serialization.Formatters.Binary;

  namespace BatchTrack.LabelPrinter
  {
      /// <summary>Print jobs held while their printer is offline, kept across passes and restarts.</summary>
      [Serializable]
      public class PrintQueueState
      {
          public List<HeldJob> Held = new List<HeldJob>();
          public DateTime LastPassUtc;

          public static PrintQueueState Load(string path)
          {
              if (!File.Exists(path))
              {
                  return new PrintQueueState();
              }

              using (var stream = File.OpenRead(path))
              {
                  return (PrintQueueState)new BinaryFormatter().Deserialize(stream);
              }
          }

          public void Save(string path)
          {
              Directory.CreateDirectory(Path.GetDirectoryName(path));
              var temp = path + ".tmp";
              using (var stream = File.Create(temp))
              {
                  new BinaryFormatter().Serialize(stream, this);
              }

              if (File.Exists(path))
              {
                  File.Replace(temp, path, null);
              }
              else
              {
                  File.Move(temp, path);
              }
          }
      }

      [Serializable]
      public class HeldJob
      {
          public string FileName;
          public string PrinterId;
          public string Zpl;
          public DateTime QueuedAtUtc;
          public int Attempts;
      }
  }
  EOF
  cat > legacy/LabelPrinterService/GatewayClient.cs <<'EOF'
  using System;
  using System.Net;
  using System.Text;
  using Newtonsoft.Json;

  namespace BatchTrack.LabelPrinter
  {
      public class PrinterStatus
      {
          [JsonProperty("printerId")]
          public string PrinterId { get; set; }

          [JsonProperty("online")]
          public bool Online { get; set; }
      }

      /// <summary>Client for the print gateway REST API.</summary>
      public class GatewayClient
      {
          private readonly Uri _baseAddress;

          public GatewayClient(Uri baseAddress)
          {
              _baseAddress = baseAddress;
          }

          public void Send(string printerId, string zpl)
          {
              using (var client = new WebClient())
              {
                  client.Encoding = Encoding.UTF8;
                  client.Headers[HttpRequestHeader.ContentType] = "text/plain; charset=utf-8";
                  client.UploadString(PrinterUri(printerId, "/jobs"), "POST", zpl);
              }
          }

          public bool IsOnline(string printerId)
          {
              using (var client = new WebClient())
              {
                  var json = client.DownloadString(PrinterUri(printerId, string.Empty));
                  return JsonConvert.DeserializeObject<PrinterStatus>(json).Online;
              }
          }

          private Uri PrinterUri(string printerId, string suffix)
          {
              return new Uri(_baseAddress, "printers/" + Uri.EscapeDataString(printerId) + suffix);
          }
      }
  }
  EOF
  cat > legacy/LabelPrinterService/PrintLog.cs <<'EOF'
  using System.Data;
  using System.Data.SqlClient;

  namespace BatchTrack.LabelPrinter
  {
      /// <summary>Records every print attempt in label_print_log, which is part of the batch record.</summary>
      public class PrintLog
      {
          private readonly string _connectionString;

          public PrintLog(string connectionString)
          {
              _connectionString = connectionString;
          }

          public void Record(string fileName, string printerId, string outcome)
          {
              using (var conn = new SqlConnection(_connectionString))
              using (var cmd = new SqlCommand(
                  "INSERT INTO label_print_log (file_name, printer_id, outcome, logged_at) " +
                  "VALUES (@file, @printer, @outcome, SYSUTCDATETIME())", conn))
              {
                  cmd.Parameters.Add("@file", SqlDbType.NVarChar, 260).Value = fileName;
                  cmd.Parameters.Add("@printer", SqlDbType.NVarChar, 64).Value = printerId;
                  cmd.Parameters.Add("@outcome", SqlDbType.NVarChar, 16).Value = outcome;
                  conn.Open();
                  cmd.ExecuteNonQuery();
              }
          }
      }
  }
  EOF
