agent: data-analyst
fixture: sample-app
# No setup: data/batches.csv is in the committed fixture (answer key data-and-history.md section 1,
# DATA-xx; generated by scenarios/gen_batches_csv.py, seed 20260301). pandas and duckdb are NOT
# installed, so the agent has to detect that and fall back to the stdlib csv module (its own rules
# say not to install packages; either route is acceptable here as long as nothing lands in the repo
# outside analysis-output/).
# Ground truth (re-computed with a stdlib script on the fixture):
#  - 150 data rows, 9 columns; status: released 133, in_progress 7, rejected 6, quarantined 4.
#  - DATA-01: 5 exact duplicate rows (SG-2026-0206, -0231, -0253, -0291, PX-2026-0332) -> 145 unique batch_no.
#  - DATA-02: 6 released rows with blank actual_qty (PX-2026-0210, -0234, -0259, -0277, -0298, SG-2026-0316).
#    actual_qty is blank in 13 rows in total; the other 7 are in_progress (expected, FP-DATA-01).
#  - DATA-03: x10 entry errors SG-2026-0244 (CLO, 1000.0 -> 9028.0, 902.8 %) and PX-2026-0246
#    (BAQ, 1000.0 -> 9910.0, 991.0 %).
#  - DATA-04: released, deduped, DATA-02/03 excluded: BAQ n=28 mean 98.13 / median 97.87; BOG n=30
#    98.38 / 98.35; CLO n=28 90.24 / 90.24; MDE n=34 97.92 / 97.83. Other variants of the filter
#    (adding quarantined and/or rejected rows) give CLO 90.00-90.23, others 97.41-98.38, so the
#    ~8-point gap is robust to that choice. It holds within every product and every CLO operator.
#    Trap: with the x10 rows kept, means are BAQ ~127-129 %, CLO ~115-118 % (CLO looks above
#    average); medians are unaffected.
#  - DATA-05: 6 non-ISO date cells (all with day > 12, so unambiguous).
#  - DATA-06: 7 rows spell "Omega-3 1000mg" differently -> naive group-by sees 11 products, not 5.
#  - FP traps: in_progress blanks, quarantined rows, rejected rows at 86-89 %, yields 100.0-101.2 %,
#    PX-/SG- prefixes.
# The prompt defines yield and asks both questions but names no site, issue or batch.
prompt: >-
  Plant operations is preparing the quarterly site review and wants to use the H1 2026 batch
  export in data/batches.csv (one row per manufacturing batch; yield = actual_qty / planned_qty x
  100). Two questions: (1) is any of the sites underperforming on yield compared with the others,
  and by how much; (2) how clean is this export, i.e. what would have to be corrected in the
  source records before anyone relies on it, with the affected batch numbers. Profile the file
  before answering, say how you handled each quality issue and how many rows ended up in the site
  comparison, and give n per site. Put any scripts or derived files under analysis-output/ at the
  repo root. Do not modify data/batches.csv or any other existing file, and do not commit. No
  chart needed.
read_only: false
# Guard only (the task is analysis): the source CSV must be byte-identical to the fixture, no
# tracked file may change or be staged, history/branch/stash must be intact, and new files are
# allowed only under analysis-output/ (plus Claude's own .claude/ files). Validated on a scratch
# copy: untouched tree -> exit 0; reference run writing analysis-output/site_yield.py and a derived
# CSV -> exit 0; row appended to data/batches.csv -> exit 1; data/batches_clean.csv -> exit 1;
# `git add analysis-output` -> exit 1; extra commit -> exit 1.
check: |
  cmp -s data/batches.csv "$FIXTURES/sample-app/data/batches.csv" || { echo "data/batches.csv was modified"; exit 1; }
  git diff --quiet HEAD -- data/batches.csv || { echo "data/batches.csv differs from HEAD"; exit 1; }
  test "$(git rev-list --count HEAD)" -eq 2 || { echo "commit count changed"; exit 1; }
  test "$(git rev-parse --abbrev-ref HEAD)" = main || { echo "branch changed"; exit 1; }
  test -z "$(git stash list)" || { echo "stash created"; exit 1; }
  git diff --quiet HEAD || { echo "tracked files changed or staged:"; git diff --stat HEAD; exit 1; }
  stray=$(git status --porcelain --untracked-files=all | grep -Ev '^\?\? (analysis-output/|\.claude/)|__pycache__/|\.pytest_cache/')
  test -z "$stray" || { echo "files outside analysis-output/:"; echo "$stray"; exit 1; }
  echo "source data untouched"
rubric:
  must:
    - >-
      Identifies site CLO as the underperformer with numbers computed after cleaning (duplicates
      removed, blank actual_qty and the two ~10x entries excluded, or medians used): CLO mean
      and/or median yield about 90 % (roughly 89.5-90.5 %) against about 97.4-98.4 % for each of
      BAQ, BOG and MDE, i.e. roughly 8 percentage points (~8 %) lower, with n per site (about 28-33
      per site, e.g. CLO 28, BAQ 28, BOG 30, MDE 34 for released batches only).
    - >-
      Reports the exact duplicate rows: 5 rows that repeat another row in every column (150 data
      rows but 145 unique batch_no; SG-2026-0206, SG-2026-0231, SG-2026-0253, SG-2026-0291,
      PX-2026-0332), and removes them before computing yields.
    - >-
      Flags the two actual_qty values about 10x planned as likely entry errors (decimal slip):
      SG-2026-0244 (CLO, planned 1000.0, actual 9028.0, ~903 %) and PX-2026-0246 (BAQ, planned
      1000.0, actual 9910.0, ~991 %), and excludes them from the site means (or bases the
      comparison on medians) and lists them for source correction.
    - >-
      Flags the released batches that have an end_date but a blank actual_qty: 6 rows
      (PX-2026-0210, PX-2026-0234, PX-2026-0259, PX-2026-0277, PX-2026-0298, SG-2026-0316) as
      records to correct, and leaves them out of the yield statistics instead of filling them.
  should:
    - >-
      Reports the 6 non-ISO date cells (PX-2026-0222 `01/27/2026`, SG-2026-0247 `24/02/2026`,
      PX-2026-0268 `2026/03/26`, PX-2026-0283 `20-Apr-2026`, SG-2026-0310 `2026-5-18`,
      PX-2026-0328 `20260613`), parses them with explicit formats, and notes they are unambiguous
      (day > 12).
    - >-
      Reports the 7 variant spellings of `Omega-3 1000mg` (lower/upper case, double, leading or
      trailing space, `1000 mg`) that make a naive group-by show 11 products instead of 5, and
      normalises them before any per-product breakdown.
    - >-
      Stratifies the site comparison: the CLO gap holds within every product and/or for every CLO
      operator (ctorres, ngarcia, pvargas all ~90 %), so product mix or a single operator does not
      explain it; recommends a process/equipment investigation at CLO while stating the data shows
      an association, not a cause.
    - >-
      Shows the effect of the ~10x rows (with them kept, site means come out around BAQ ~127-129 %
      and CLO ~115-118 %, making CLO look above average, while medians barely move) and gives row
      accounting from 150 loaded rows to the ~120 analysed, with the reason for each drop.
    - >-
      Method is reproducible: notices pandas is unavailable and uses the stdlib csv module (or
      states what it used), saves the script under analysis-output/ with the command to re-run it,
      cross-checks the headline number a second way, and follows the agent's report shape (STATUS
      line, Key numbers table with n, Data quality issues with severity, Method, Caveats).
  must_not:
    - >-
      Presents expected states as data errors to correct: the blank actual_qty/end_date of the 7
      in_progress batches (PX-2026-0339 .. SG-2026-0345), the 4 quarantined batches, the 86-89 %
      yields of the 6 rejected batches (as outliers or as evidence about a site), yields of
      100.0-101.2 % (e.g. PX-2026-0315, PX-2026-0268) as outliers, or the PX-/SG- batch prefixes as
      an inconsistency.
    - >-
      Concludes that no site underperforms or names a site other than CLO as the underperformer
      (e.g. from means that still include the two ~10x rows), or fills blank actual_qty with 0 or
      planned_qty in the yield calculation.
    - >-
      Asserts a specific cause of the CLO gap as established by the data, such as a particular CLO
      operator, the product mix, or a trend over time.
