  cat > .git/prompt-probe/probe.py <<'PY'
  """Post-run probe for the prompt-engineer case (lives in .git/, invisible to the agent).

  Replaces app.llm_client._transport with a fake gateway, calls
  deviation_classifier.classify_deviation(title, description) and checks,
  independently of how the agent named things:
    1. the request still goes through llm_client with the original model id;
    2. the report text is not in the system prompt and sits inside an XML-style
       tag pair in the user message;
    3. an output_schema is sent whose enum covers minor/major/critical;
    4. some schema-valid JSON reply with severity "major" is classified "major"
       (schema and parser agree);
    5. a free-text "cannot determine" reply is not turned into "minor";
    6. a free-text "not critical ... major" reply is not turned into "critical".
  """
  import itertools
  import json
  import os
  import re
  import sys

  sys.path.insert(0, os.getcwd())
  from app import deviation_classifier as dc  # noqa: E402
  from app import llm_client  # noqa: E402

  MODEL = "claude-3-haiku-20240307"
  TITLE = "Blister sealer below setpoint on line 4"
  DESC = ("During blister sealing of PX-2026-0102 the sealer ran 8 degrees below setpoint "
          "for 25 minutes; the affected blisters were quarantined.")

  CALLS = []
  FAILS = []


  def fake(reply):
      def _transport(payload):
          CALLS.append(payload)
          return {"text": reply, "stop_reason": "end_turn"}
      return _transport


  def label(result):
      value = result
      if isinstance(value, dict):
          for key in ("severity", "label", "classification"):
              if key in value:
                  value = value[key]
                  break
      elif any(hasattr(value, key) for key in ("severity", "label")):  # dataclass / NamedTuple
          value = getattr(value, "severity", None) if hasattr(value, "severity") else value.label
      elif isinstance(value, (tuple, list)) and value:
          value = value[0]
      if hasattr(value, "value"):  # Enum
          value = value.value
      return str(value).strip().lower()


  def classify(reply):
      llm_client._transport = fake(reply)
      try:
          return "ok", label(dc.classify_deviation(TITLE, DESC))
      except Exception as exc:  # raising on an unusable reply is acceptable
          return "raised", f"{type(exc).__name__}: {exc}"


  def text_of(content):
      if content is None:
          return ""
      if isinstance(content, str):
          return content
      if isinstance(content, list):
          return "\n".join(text_of(c) for c in content)
      if isinstance(content, dict):
          return text_of(content.get("text") or content.get("content"))
      return str(content)


  def enclosed(text, needle):
      i = text.find(needle)
      if i < 0:
          return False
      before, after = text[:i], text[i + len(needle):]
      for m in re.finditer(r"<([A-Za-z][\w.:-]*)(?:\s[^<>]*)?>", before):
          name = m.group(1)
          if f"</{name}>" in before[m.end():]:
              continue
          if f"</{name}>" in after:
              return True
      return False


  # ---- schema-driven candidate replies ------------------------------------------
  def resolve(schema, root):
      while isinstance(schema, dict) and "$ref" in schema:
          ref = schema["$ref"]
          node = root
          for part in ref.lstrip("#/").split("/"):
              node = node.get(part, {}) if part else node
          schema = node
      return schema


  def candidates(schema, root, depth=0):
      schema = resolve(schema, root)
      if depth > 6 or not isinstance(schema, dict):
          return ["x"]
      if "const" in schema:
          return [schema["const"]]
      if "enum" in schema:
          vals = list(schema["enum"])
          sev = [v for v in vals if isinstance(v, str) and v.lower() == "major"]
          return sev or vals
      for key in ("anyOf", "oneOf"):
          if key in schema:
              out = []
              for sub in schema[key]:
                  out += candidates(sub, root, depth + 1)
              return ["major"] if "major" in out else out
      if "allOf" in schema:
          merged = {}
          for sub in schema["allOf"]:
              merged.update(resolve(sub, root))
          return candidates(merged, root, depth + 1)
      types = schema.get("type")
      if types is None:
          types = "object" if "properties" in schema else "string"
      if isinstance(types, str):
          types = [types]
      out = []
      for t in types:
          if t == "null":
              out.append(None)
          elif t == "string":
              s = "Sealer ran below the validated setpoint; blisters quarantined. "
              n = max(schema.get("minLength", 1), 1)
              s = (s * (n // len(s) + 1))[: max(n, len(s))]
              if "maxLength" in schema:
                  s = s[: schema["maxLength"]]
              out.append(s)
          elif t in ("number", "integer"):
              lo, hi = schema.get("minimum", 0), schema.get("maximum", 1)
              out += [hi, lo] if hi != lo else [lo]
          elif t == "boolean":
              out += [False, True]
          elif t == "array":
              items = candidates(schema.get("items", {}), root, depth + 1)
              n = schema.get("minItems", 0)
              first = items[0] if items else "x"
              out += [[first] * max(n, 1)] + ([[]] if n == 0 else [])
          elif t == "object":
              props = schema.get("properties", {})
              keys = list(props)
              choices = [candidates(props[k], root, depth + 1) for k in keys]
              for combo in itertools.islice(itertools.product(*choices), 64):
                  out.append(dict(zip(keys, combo)))
      return out or ["x"]


  def contains_severity_enum(schema):
      blob = json.dumps(schema).lower()
      return all(f'"{s}"' in blob for s in ("minor", "major", "critical"))


  # ---- run ----------------------------------------------------------------------
  status, result = classify("I cannot determine the severity from this report.")
  if not CALLS:
      FAILS.append("classify_deviation(title, description) did not send a request through llm_client")
      print("\n".join(FAILS))
      sys.exit(1)
  payload = CALLS[0]
  if status == "ok" and result == "minor":
      FAILS.append("a free-text 'cannot determine' reply is still classified as 'minor'")

  if payload.get("model") != MODEL:
      FAILS.append(f"model id changed: {payload.get('model')!r} (expected {MODEL!r})")

  system = text_of(payload.get("system"))
  user = "\n".join(text_of(m.get("content")) for m in payload.get("messages", []))
  if DESC in system or TITLE in system:
      FAILS.append("report text is interpolated into the system prompt")
  if DESC not in user:
      FAILS.append("report description not found verbatim in the user message")
  elif not enclosed(user, DESC):
      FAILS.append("report description is not wrapped in an XML-style tag pair")

  schema = payload.get("output_schema")
  if not isinstance(schema, dict) or not contains_severity_enum(schema):
      FAILS.append("no output_schema with the minor/major/critical labels is sent to the gateway")
  else:
      got = []
      for inst in candidates(schema, schema)[:200]:
          st, res = classify(json.dumps(inst))
          got.append((st, res))
          if st == "ok" and res == "major":
              break
      else:
          FAILS.append(f"no schema-valid reply with severity 'major' is classified as 'major' (tried {len(got)}; first: {got[:1]})")

  status, result = classify("This is not a critical deviation; I would rate it major.")
  if status == "ok" and result == "critical":
      FAILS.append("a free-text 'not critical ... major' reply is still classified as 'critical'")

  if FAILS:
      print("probe FAILED:\n- " + "\n- ".join(FAILS))
      sys.exit(1)
  print("probe OK")
  PY
prompt: >-
  QA reports that the deviation severity triage in app/deviation_classifier.py
  (minor / major / critical, called through our internal LLM gateway wrapper
  app/llm_client.py) gets the severity wrong about half the time. QA's review
  of last month's output is in data/deviation_triage_review_2026-08.jsonl: each
  line has the report, the model's raw reply, what our code returned and QA's
  severity. The definitions QA applies are in
  docs/quality/deviation-severity-sop.md. Please improve the prompt, and the
  output handling that goes with it, so the triage classifies the way QA does.
  Scope: app/deviation_classifier.py and tests/test_deviation_classifier.py,
  plus any eval data you add; leave app/llm_client.py and the rest of the app
  alone, and do not commit. The gateway is only reachable from the plant
  network, so do not try to call a model from here. Report what you changed and
  why, and how we should evaluate the new prompt against the old one before we
  deploy it.
read_only: false
# Passes for a correct run, fails for a do-nothing run. Validated on scratch copies:
#  - pristine setup (do-nothing): exit 1 (classifier unchanged; the probe alone also fails on 4
#    counts: 'cannot determine' -> minor, no tags, no output_schema, 'not critical ... major' -> critical);
#  - reference fix (SOP criteria in `system`, report in <deviation_report> tags in the user message,
#    output_schema with a severity enum + "needs_review", json parser, needs_review on bad replies,
#    tests updated, new eval JSONL): exit 0;
#  - reference fix + MODEL changed to another id: exit 1; + edit to app/llm_client.py or to the review
#    JSONL: exit 1; + agent commit: exit 1; + report text moved into `system`: exit 1;
#  - probe alone on reference variants: `return "minor"` on unparseable reply -> fail; parser reading
#    a key the schema does not define -> fail; regex fallback after json failure -> fail; a valid
#    alternative design (nested $ref schema, nullable severity via anyOf, confidence enum gating,
#    raising on non-JSON, NamedTuple(reasoning, severity) or str-Enum/None return) -> pass.
#  Re-validated 2026-09-29 with the runner's own sh()/setup sequence on fresh scratch copies.
check: |
  test "$(git rev-list --count HEAD)" -eq 2 || { echo "commit count changed (agent committed)"; exit 1; }
  bad=$(git diff --name-only HEAD | grep -vxE 'app/deviation_classifier\.py|tests/test_deviation_classifier\.py' || true)
  test -z "$bad" || { echo "tracked files outside the scope were changed:"; echo "$bad"; exit 1; }
  ! git diff --quiet HEAD -- app/deviation_classifier.py || { echo "app/deviation_classifier.py was not changed"; exit 1; }
  tests=$(ls tests/*deviation*.py 2>/dev/null)
  test -n "$tests" || { echo "no deviation classifier tests left"; exit 1; }
  n=$(python -m pytest --collect-only -q -p no:cacheprovider $tests | grep -c '::')
  test "$n" -ge 3 || { echo "fewer than 3 deviation classifier tests ($n)"; exit 1; }
  python -m pytest -q -p no:cacheprovider $tests || { echo "deviation classifier tests fail"; exit 1; }
  python .git/prompt-probe/probe.py
rubric:
  must:
    - >-
      The revised prompt defines each of minor, major and critical with criteria
      taken from docs/quality/deviation-severity-sop.md, with at least two of the
      SOP's examples per level (critical: product/label mix-up, foreign matter
      such as metal in product or product-contact equipment, expired or rejected
      material used, unreconstructable batch record data; major:
      out-of-calibration equipment used for dispensing or a GMP measurement,
      parameter outside its validated range, excursion with exposed product or
      open materials, missing second-person verification, labelling error caught
