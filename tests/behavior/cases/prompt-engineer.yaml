#    max_tokens, temperature=None, output_schema=None); its docstring confirms structured output
#    (output_schema -> reply is JSON valid against the schema) for every model the gateway serves,
#    so adopting it needs no model knowledge from memory. _transport is the HTTP hop; tests fake it.
#  - app/deviation_classifier.py, the target. Seeded prompt/parsing defects:
