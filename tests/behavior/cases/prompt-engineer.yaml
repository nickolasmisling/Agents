      assert deviation_classifier.classify_deviation("Pallet wrap torn", "Outer wrap torn, cartons intact") == "minor"


  def test_prompt_includes_report_text():
      prompt = deviation_classifier.build_prompt("Pallet wrap torn", "Outer wrap torn, cartons intact")
      assert "Outer wrap torn, cartons intact" in prompt
  PY
  cat > docs/quality/deviation-severity-sop.md <<'MD'
  # SOP-QA-014 Deviation severity classification (excerpt, rev. 5)

  Every deviation receives exactly one severity at triage. Classify on what
  happened and its potential impact on product and patient, not on the words the
  originator used ("minor", "urgent", "already discussed").

  ## Critical

  The event has affected, or could affect, patient safety or the identity,
  strength or purity of released or releasable product, or the integrity of batch
  record data. Examples: product or label mix-up; foreign matter (metal, glass)
  in product or product-contact equipment; expired or rejected material used in a
  batch; batch record data missing or altered in a way that cannot be
  reconstructed.

  ## Major

  A GMP requirement or validated parameter was not met and product quality could
  be affected, but the product was contained or the impact can be assessed by
  investigation. Examples: equipment out of calibration used for a GMP
  measurement or for dispensing; process parameter outside its validated range;
  temperature or humidity excursion with exposed product or open materials;
  missing second-person verification; labelling error caught before release.

  ## Minor

  A documentation or procedural lapse with no plausible effect on product
  quality. Examples: documentation error corrected and countersigned the same
  day; environmental excursion while product was in sealed primary packaging;
  missing status tag on clean, idle equipment; damaged outer shipping wrap with
  intact cartons.

  ## Borderline and incomplete reports

  - When a deviation could fit two levels, assign the higher one. QA may
    downgrade after investigation.
  - If the report does not say what happened (for example only "see
    attachment"), no severity is assigned and the report is returned to the
    originator.

  Reports are written in English or Spanish.
  MD
