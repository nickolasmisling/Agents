  """Client for the plant's internal LLM gateway.

  The gateway is an HTTP proxy in front of the model provider; it is only
  reachable from the plant network (BATCHTRACK_LLM_URL). Tests replace
  `_transport` with a fake, so no test ever calls a model.

  Gateway 2.3 (deployed at BOG and BAQ since 2026-06) supports structured
  output: when `output_schema` is given it is forwarded as the provider's
  JSON-schema output format, and the reply text is a JSON document that
  validates against the schema. This works for every model id the gateway
  serves: for models without native support the gateway enforces the schema
  itself.
  """

  import json
  import os
  import urllib.request

  LLM_URL = os.environ.get("BATCHTRACK_LLM_URL")


  def _transport(payload):
      if not LLM_URL:
          raise RuntimeError("BATCHTRACK_LLM_URL is not set (the LLM gateway is only reachable in the plant)")
      req = urllib.request.Request(
          LLM_URL.rstrip("/") + "/v1/complete",
          data=json.dumps(payload).encode("utf-8"),
          headers={"Content-Type": "application/json"},
          method="POST",
      )
      with urllib.request.urlopen(req, timeout=30) as resp:
          return json.loads(resp.read().decode("utf-8"))


  def complete(prompt, *, model, system=None, max_tokens=1024, temperature=None, output_schema=None):
      """Send one user message and return the model's reply text.

      prompt:        text of the user message.
      model:         model id, passed through to the provider unchanged.
      system:        optional system prompt.
      max_tokens:    upper bound on the reply length.
      temperature:   optional sampling temperature (provider default when None).
      output_schema: optional JSON Schema (dict). The reply is then a JSON string
                     that validates against it.

      Raises RuntimeError if the gateway reports an error or the reply was cut
      off at max_tokens.
      """
      payload = {
          "model": model,
          "max_tokens": max_tokens,
          "messages": [{"role": "user", "content": prompt}],
      }
      if system is not None:
          payload["system"] = system
      if temperature is not None:
          payload["temperature"] = temperature
      if output_schema is not None:
          payload["output_schema"] = output_schema
      data = _transport(payload)
      if data.get("error"):
          raise RuntimeError(f"LLM gateway error: {data['error']}")
      if data.get("stop_reason") == "max_tokens":
          raise RuntimeError("LLM reply was truncated at max_tokens")
      return data["text"]
  PY
  cat > app/deviation_classifier.py <<'PY'
  """First-pass severity triage for deviation reports.

  Operators and QA log a deviation as a short title plus a free-text description
  (English or Spanish). This module asks the LLM gateway for a severity so that
  critical deviations reach the QA manager the same day; QA confirms the
  severity before the deviation is closed.
  """

  import re

  from . import llm_client

  MODEL = "claude-3-haiku-20240307"

  SEVERITIES = ("minor", "major", "critical")

  _SEVERITY_RE = re.compile(r"(minor|major|critical)", re.IGNORECASE)


  def build_prompt(title, description):
      return (
          "You are a world-class GMP quality assurance expert with 30 years of experience. "
          "IMPORTANT: classify the severity of this deviation. " + title + ". " + description
          + " Be thorough and explain your reasoning fully, but keep the answer short. "
          "Use CAPITALS if it is critical. Answer with the severity."
      )


  def parse_severity(reply):
      match = _SEVERITY_RE.search(reply)
      return match.group(1).lower() if match else "minor"


  def classify_deviation(title, description):
      """Return 'minor', 'major' or 'critical' for a deviation report."""
      reply = llm_client.complete(build_prompt(title, description), model=MODEL, max_tokens=300)
      return parse_severity(reply)


  def needs_same_day_escalation(title, description):
      """Critical deviations are escalated to the QA manager on the day they are logged."""
      return classify_deviation(title, description) == "critical"
  PY
  cat > tests/test_deviation_classifier.py <<'PY'
  from app import deviation_classifier, llm_client


