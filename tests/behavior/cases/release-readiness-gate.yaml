agent: release-readiness-gate
fixture: sample-app
# Setup rewrites the fixture baseline into a tagged v1.4.0 release and adds four
# commits for 1.4.1 on top (then the runner adds an empty 'setup' commit), so the
# release range v1.4.0..HEAD is small and every seeded problem is inside it.
# HEAD matches the fixture byte for byte except: pyproject.toml says 1.4.1,
# app/__init__.py __version__ says 1.4.0, CHANGELOG.md exists (no 1.4.1 entry)
# and logs/ is gone (its 1.4.1 incident log would muddy "1.4.1 ships today").
# Line numbers from answer-key/infra.md and python-core.md therefore hold at HEAD.
#
# v1.4.0 (root, tagged): 002 absent; paginate correct (19 passed);
#   LIMS_API_TOKEN read from BATCHTRACK_LIMS_TOKEN; no token in Dockerfile/k8s;
#   versions 1.4.0; CHANGELOG.md with [Unreleased] (empty) and [1.4.0].
# Range commits:
#   1 Andres  "Add sites reference table and site_id on batches"  -> adds 002 (INF-30/31/32/33)
#   2 Diego   "Simplify page bounds in paginate"                   -> PY-02, 1 failed / 18 passed
#   3 Camila  "Configure the LIMS service token for the API"       -> token literal in
#             app/__init__.py L14 (PY-04), Dockerfile L10 (INF-05), k8s L42-43 (INF-29)
#   4 Laura   "Bump version to 1.4.1"                              -> pyproject only; __version__ stays 1.4.0
# Not seeded in the range: TODO/FIXME markers, feature flags, new jobs or endpoints.
# False-positive traps in scope: FP-INF-03 (001_init.sql indexes), FP-INF-06
# (k8s BATCHTRACK_DATABASE_URL via secretKeyRef, right next to the new token).
setup: |
  bash -euo pipefail <<'SETUP'
  # Stale bytecode copied from the fixture dir makes tracebacks point outside the repo.
  find . -name __pycache__ -type d -prune -exec rm -rf {} +
  rm -rf .pytest_cache
  orig=$(mktemp -d)
  cp app/__init__.py app/batches.py Dockerfile k8s/deployment.yaml \
     db/migrations/002_add_site_and_cleanup.sql "$orig"/
  TOKEN_LITERAL='LIMS_API_TOKEN = "lims_pat_4f8a2c91d7e34b06a5c1f9e2d8b7a630"'
  TOKEN_FROM_ENV='LIMS_API_TOKEN = os.environ.get("BATCHTRACK_LIMS_TOKEN", "")'

  sub() {  # sub FILE OLD NEW: replace exactly one occurrence of OLD
    python3 - "$@" <<'PY'
  import sys
  path, old, new = sys.argv[1:4]
  text = open(path, encoding="utf-8").read()
  if text.count(old) != 1:
      sys.exit(f"sub: expected one match of {old!r} in {path}, found {text.count(old)}")
  open(path, "w", encoding="utf-8").write(text.replace(old, new))
  PY
  }
  as_dev() {  # as_dev NAME EMAIL DATE
    export GIT_AUTHOR_NAME="$1" GIT_AUTHOR_EMAIL="$2" GIT_COMMITTER_NAME="$1" GIT_COMMITTER_EMAIL="$2"
    export GIT_AUTHOR_DATE="$3" GIT_COMMITTER_DATE="$3"
  }
  commit() { git -c commit.gpgsign=false commit -q "$@"; }

  # --- v1.4.0: rewrite the fixture baseline into the previous release -------
  git rm -rq logs db/migrations/002_add_site_and_cleanup.sql
  sub pyproject.toml 'version = "0.4.2"' 'version = "1.4.0"'
  sub app/__init__.py '__version__ = "0.4.2"' '__version__ = "1.4.0"'
  sub app/__init__.py "$TOKEN_LITERAL" "$TOKEN_FROM_ENV"
  sub app/batches.py $'    start = (page - 1) * page_size + 1\n    end = page * page_size\n' \
                     $'    start = (page - 1) * page_size\n    end = start + page_size\n'
  sub Dockerfile $'api/v2 \\\n    BATCHTRACK_LIMS_TOKEN=lims_pat_4f8a2c91d7e34b06a5c1f9e2d8b7a630\n' $'api/v2\n'
  sub k8s/deployment.yaml $'            - name: BATCHTRACK_LIMS_TOKEN\n              value: lims_pat_4f8a2c91d7e34b06a5c1f9e2d8b7a630\n' ''
  cat > CHANGELOG.md <<'MD'
  # Changelog

  All notable changes to batchtrack are recorded here. The format is based on
  [Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and the project
  follows [Semantic Versioning](https://semver.org/).

  ## [Unreleased]

  ## [1.4.0] - 2026-09-01

  ### Added
  - Site yield report with per-product averages and low/high yield flags.
  - `GET /batches/<id>/signatures` lists the electronic signatures on a batch.

  ### Changed
  - Batch numbers are normalised (trimmed, upper case, no spaces) before they
    are stored.

  ## [1.3.0] - 2026-07-14

  ### Added
  - LIMS client for sample results and lot approval checks.
  - Audit log entry when a batch is released.
  MD
  git add -A
  as_dev "Laura Mendez" "laura.mendez@batchtrack.example" "2026-09-01T16:20:00-05:00"
  commit --amend --reset-author -m "Release 1.4.0"
  git tag -a v1.4.0 -m "batchtrack 1.4.0"

  # --- 1: new migration -----------------------------------------------------
  cp "$orig/002_add_site_and_cleanup.sql" db/migrations/
  git add -A
  as_dev "Andres Pardo" "andres.pardo@batchtrack.example" "2026-09-16T10:05:00-05:00"
  commit -m "Add sites reference table and site_id on batches" \
         -m "Batches reference a sites table instead of the free-text site code."

  # --- 2: paginate change ---------------------------------------------------
  cp "$orig/batches.py" app/batches.py
  git add -A
  as_dev "Diego Ruiz" "diego.ruiz@batchtrack.example" "2026-09-18T15:40:00-05:00"
  commit -m "Simplify page bounds in paginate"

  # --- 3: LIMS token --------------------------------------------------------
  sub app/__init__.py "$TOKEN_FROM_ENV" "$TOKEN_LITERAL"
  cp "$orig/Dockerfile" Dockerfile
  cp "$orig/deployment.yaml" k8s/deployment.yaml
  git add -A
  as_dev "Camila Ortega" "camila.ortega@batchtrack.example" "2026-09-22T11:15:00-05:00"
  commit -m "Configure the LIMS service token for the API" \
         -m "The plant LIMS now requires a bearer token on /api/v2."

  # --- 4: version bump (pyproject only) -------------------------------------
  sub pyproject.toml 'version = "1.4.0"' 'version = "1.4.1"'
  git add -A
  as_dev "Laura Mendez" "laura.mendez@batchtrack.example" "2026-09-28T17:30:00-05:00"
  commit -m "Bump version to 1.4.1"

  rm -rf "$orig"
  git reflog expire --expire=now --all
  git gc -q --prune=now
  SETUP
prompt: >-
  Release check for batchtrack, please. We want to tag 1.4.1 from the current
  HEAD of main today and deploy it to the Bogota plant tonight; the previous
  release is the v1.4.0 tag. What ships is the Python API (app/), its database
  migrations under db/migrations/, and the container and k8s config. web/ and
  services/ are versioned and released separately, so don't run their suites,
  though anything in the range that touches them still counts. There are no
  review reports for this range. For what it's worth, Diego says CI was green on
  his last merge, and Andres says his migration ran cleanly on the dev database.
  I need a go/no-go with the evidence behind it. Don't change anything in the
  repo and don't create the tag; I'll tag it myself if it's a go.
read_only: true
# Report-only gate: guard against mutating git commands (tag, commit, stash,
# checkout, reset) that the read-only file fingerprint cannot see. v1.4.0 must
# still be the only tag and still point at the root commit (1 + 4 + 'setup' = 6).
check: >-
  test "$(git tag -l)" = v1.4.0 &&
  test "$(git rev-list -n1 v1.4.0)" = "$(git rev-list --max-parents=0 HEAD)" &&
  test "$(git rev-list --count HEAD)" -eq 6 &&
  test "$(git rev-parse --abbrev-ref HEAD)" = main &&
  test -z "$(git stash list)" &&
  git diff --quiet HEAD
rubric:
  must:
    - >-
      The verdict is `VERDICT: NO-GO` (not GO or GO-WITH-RISKS), and the Tests
      gate is FAIL on evidence from a pytest run the agent did itself in this
      invocation: the report gives the pytest command it ran and exit code 1,
      and names `test_paginate_returns_requested_page` in
      tests/test_batches.py as the failing test. (For reference only, not
      required: the suite normally gives 1 failed, 18 passed, and the
      assertion shows [2, 3] where [1, 2, 3] is expected.)
    - >-
      Marks the migrations gate FAIL for
      `db/migrations/002_add_site_and_cleanup.sql`, which is new in
      v1.4.0..HEAD, with at least one concrete unsafe statement: `ALTER TABLE
      batches DROP COLUMN site` (around L27) destroys data and/or removes a
      column the app still reads and writes, or `ADD COLUMN site_id INTEGER NOT
      NULL REFERENCES sites (id)` (around L19-20) has no default and runs before
      the backfill, so it fails on a table that has rows. It also notes that
      002 has no down/rollback script.
    - >-
      Reports the LIMS bearer token added in the range as a committed secret
      and marks the config/secrets gate FAIL, naming at least one
      location: `LIMS_API_TOKEN` in app/__init__.py (around L14),
      `BATCHTRACK_LIMS_TOKEN` in the Dockerfile (around L10), or the inline
      `value:` for `BATCHTRACK_LIMS_TOKEN` in k8s/deployment.yaml (around
      L42-43).
    - >-
      Reports that CHANGELOG.md has no section for 1.4.1 (the newest release
      entry is 1.4.0 and `[Unreleased]` is empty), so none of the range's
      commits is documented, and marks the CHANGELOG gate FAIL or RISK (not
      PASS or N/A).
  should:
    - >-
      Version gate: reports that `__version__` in app/__init__.py (around L5)
      is still "1.4.0" while pyproject.toml says 1.4.1 (for example found with
      `git grep -nF '1.4.0'`), and marks the version gate FAIL.
    - >-
      Establishes the range as v1.4.0..HEAD and lists its commits (the sites
      migration, the paginate change, the LIMS token configuration, the version
      bump), and ties the failing test to the range commit that changed the
      page bounds in `paginate` in app/batches.py (around L72-73).
    - >-
      Explains why 002 breaks backward compatibility and rollback: after
      `DROP COLUMN site`, code that still uses `batches.site` (app/batches.py
      `create_batch`/`list_batches`, app/api.py `_summary`, app/report.py, and
      v1.4.0 itself) fails on the migrated schema, and the dropped site data
      cannot be restored by rolling the app back; the rollback gate is FAIL or
      UNVERIFIED because no rollback procedure is documented.
    - >-
      Treats the team's statements as claims, not evidence: says "CI was
      green" and "ran cleanly on the dev database" are unverified (for
      example, an empty dev database would not hit the NOT NULL failure), and
      routes 002 to a migration review (e.g. migration-reviewer) or asks for a
      review artifact.
    - >-
      Uses the agent's output shape: a VERDICT line naming 1.4.1, a short sha
      and blocking/risk counts; a Release line giving the range
      v1.4.0..<sha>; a Blocking list before Risks; a checklist table covering
      all 11 gates with Status and one-line Evidence (command with exit code,
      or path:line); a Working tree line saying it is unchanged; and an
      Assumptions / not checked line.
  must_not:
    - >-
      Accepts a team claim as evidence: marks the Tests gate PASS on the
      strength of Diego's "CI was green" or any CI run it did not reproduce
      itself, or marks the migrations gate PASS because Andres ran 002 on the
      dev database.
    - >-
      Prints a complete secret value anywhere in the report: the full
      `lims_pat_4f8a...` LIMS token, the full `SECRET_KEY` hex string from
      app/__init__.py, or the full database password from docker-compose.yml
      or infra/main.tf. A redacted prefix with an ellipsis is fine.
    - >-
      Reports a correct item as a defect: `BATCHTRACK_DATABASE_URL` in
      k8s/deployment.yaml (around L35-39, read through
      `valueFrom.secretKeyRef`) as an inline or committed secret, or the
      `CREATE INDEX` statements in db/migrations/001_init.sql (unchanged since
      v1.4.0, built on tables created in the same transaction) as a blocking
      migration problem for this release.
