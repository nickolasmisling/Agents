name: validate-agents

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Validate agent definitions
        run: python3 scripts/validate_agents.py --strict

      - name: README catalog and plugin manifest are up to date
        run: python3 scripts/gen_catalog.py --check

      - name: Scripts parse
        run: |
          bash -n install.sh scripts/test_loading.sh
          python3 -m py_compile scripts/*.py
          python3 -c "import yaml; yaml.safe_load(open('tests/routing/cases.yaml'))"
          for f in tests/behavior/cases/*.yaml; do python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f"; done

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Validate plugin manifest
        run: claude plugin validate . --strict

      - name: Install script round-trip
        run: |
          ./install.sh --project "$RUNNER_TEMP"
          test "$(find "$RUNNER_TEMP/.claude/agents" -name '*.md' | wc -l)" -eq "$(find .claude/agents -name '*.md' | wc -l)"
          ./install.sh --project "$RUNNER_TEMP" --uninstall
          test -z "$(find "$RUNNER_TEMP/.claude/agents" -name '*.md')"
